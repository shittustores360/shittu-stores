<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--bg4:#222838;
  --border:#2a3040;--border2:#38435a;
  --accent:#f5a623;--accent2:#e8912a;--accent-dim:rgba(245,166,35,0.12);
  --green:#2ecc71;--green-dim:rgba(46,204,113,0.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,0.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,0.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,0.12);
  --text:#e8eaf0;--text2:#9aa0b4;--text3:#5a6070;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:16px;--shadow:0 4px 24px rgba(0,0,0,0.4);--transition:0.18s ease;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background 0.2s,color 0.2s}
#root{height:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--transition)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

.sidebar-logo{padding:20px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-text{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--text3);font-family:var(--font-mono)}

.nav-section{padding:8px 8px 0;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(245,166,35,0.2)}
.nav-icon{font-size:16px;width:20px;text-align:center}

.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);background:var(--bg3)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.user-role{font-size:10px;color:var(--text3)}

.topbar-title{font-family:var(--font-head);font-size:15px;font-weight:700;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition)}
.btn-primary{background:var(--accent);color:#000}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.2)}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;position:relative}
.stat-label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
.stat-value{font-family:var(--font-head);font-size:24px;font-weight:800;color:var(--text)}
.stat-trend{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:4px}
.trend-up{color:var(--green)}

.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:12px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid var(--border);font-size:13px}

.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-size:13px;width:100%;outline:none}
.form-input[readonly]{background:var(--bg4);color:var(--text3);cursor:not-allowed}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:650px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:24px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px}

.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-processing{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-delivered{background:var(--green-dim);color:var(--green)}

.bundle-box{background:var(--bg3);border:1px solid var(--border);padding:15px;border-radius:10px;margin-bottom:12px}
.chart-container{height:150px;width:100%;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
const h = React.createElement;
const {useState, useEffect, useMemo} = React;

// ═══════════════════════════════════════════════════════
// API (HARDCODED PERMANENTLY)
// ═══════════════════════════════════════════════════════
const API_URL = "https://script.google.com/macros/s/AKfycbwxdGslHWScLe-l3lNt1SJLx_AbveynGvu-y7RwGkUemxhc_zRGBU7kPo5ZpDe6b1C8/exec";

const API = {
    async call(params) {
        try {
            const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(params) });
            return await r.json();
        } catch (e) { return { success: false, error: 'Database Connection Error' }; }
    }
};

// ═══════════════════════════════════════════════════════
// APP MAIN
// ═══════════════════════════════════════════════════════

function App() {
    const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('ssUser')));
    const [page, setPage] = useState('dashboard');

    if (!user) return h(LoginPage, { onLogin: (u) => { setUser(u); localStorage.setItem('ssUser', JSON.stringify(u)); } });

    const nav = (id) => h('div', { className: `nav-item ${page === id ? 'active' : ''}`, onClick: () => setPage(id) }, 
        h('span', { className: 'nav-icon' }, id === 'dashboard' ? '📊' : id === 'orders' ? '📦' : id === 'analytics' ? '📈' : id === 'products' ? '🏷️' : '👥'),
        id.toUpperCase()
    );

    return h('div', { className: 'app' },
        h('aside', { className: 'sidebar' },
            h('div', { className: 'sidebar-logo' },
                h('div', { className: 'logo-text' }, 'SHITTU STORES'),
                h('div', { className: 'logo-sub' }, 'Business Manager')
            ),
            h('div', { className: 'nav-section' },
                h('div', { className: 'nav-section-label' }, 'Menu'),
                nav('dashboard'),
                nav('orders'),
                nav('analytics'),
                user.role === 'admin' ? nav('products') : null,
                user.role === 'admin' ? nav('staff') : null
            ),
            h('div', { className: 'sidebar-footer' },
                h('div', { className: 'user-pill' },
                    h('div', { className: 'user-avatar' }, user.name[0]),
                    h('div', null, h('div', { className: 'user-name' }, user.name), h('div', { className: 'user-role' }, user.role))
                ),
                h('button', { className: 'btn btn-secondary btn-sm', style: {width:'100%', marginTop:10}, onClick: () => { setUser(null); localStorage.removeItem('ssUser'); } }, 'Logout')
            )
        ),
        h('main', { className: 'main' },
            h('div', { className: 'topbar' }, h('div', { className: 'topbar-title' }, page.toUpperCase())),
            h('div', { className: 'content' },
                page === 'dashboard' && h(DashboardPage, { user }),
                page === 'orders' && h(OrdersPage, { user }),
                page === 'analytics' && h(AnalyticsPage, { user }),
                page === 'products' && h(ProductsPage),
                page === 'staff' && h(StaffPage)
            )
        )
    );
}

// ═══════════════════════════════════════════════════════
// PAGES (SHOPIFY LOGIC + DARK THEME)
// ═══════════════════════════════════════════════════════

function DashboardPage({ user }) {
    const [data, setData] = useState(null);
    useEffect(() => {
        API.call({ action: 'getDashboard', username: user.username, role: user.role }).then(r => r.success && setData(r.data));
    }, []);

    const stat = (lbl, val, trend, cls) => h('div', { className: `stat-card` },
        h('div', { className: 'stat-label' }, lbl),
        h('div', { className: 'stat-value' }, val),
        h('div', { className: 'stat-trend trend-up' }, trend)
    );

    return h('div', null,
        h('h2', { style: { fontFamily: 'var(--font-head)', marginBottom: 25 } }, 'Welcome back, ' + user.name),
        h('div', { className: 'stat-grid' },
            stat('Total Sales', data?.revenue || 'GH₵ 0', '↑ 12%', 'green'),
            stat('Total Orders', data?.totalOrders || '0', '↑ 5%', 'blue'),
            stat('Conversion Rate', (data?.conversion || '0') + '%', 'Stable', 'orange'),
            stat('Commission Due', '₦' + (data?.pendingPayout || '0'), 'Pending', 'purple')
        ),
        h('div', { className: 'card' },
            h('div', { className: 'modal-title', style: { marginBottom: 15 } }, 'Latest Store Activity'),
            h('div', { className: 'table-wrap' },
                h('table', null,
                    h('thead', null, h('tr', null, ['Customer', 'Product', 'Status', 'Amount'].map(h => h('th', null, h)))),
                    h('tbody', null, (data?.recentOrders || []).map(o => h('tr', { key: o.id },
                        h('td', null, o.customerName), h('td', null, o.product),
                        h('td', null, h('span', { className: 'badge badge-processing' }, o.deliveryStatus)),
                        h('td', null, 'GH₵ ' + o.sellingPrice)
                    )))
                )
            )
        )
    );
}

function OrdersPage({ user }) {
    const [orders, setOrders] = useState([]);
    const [prods, setProds] = useState([]);
    const [modal, setModal] = useState(false);

    const refresh = () => {
        API.call({ action: 'getOrders' }).then(r => r.success && setOrders(r.data));
        API.call({ action: 'getProducts' }).then(r => r.success && setProds(r.data));
    };
    useEffect(() => refresh(), []);

    return h('div', null,
        h('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 20 } },
            h('h2', null, 'Order Management'),
            h('button', { className: 'btn btn-primary', onClick: () => setModal(true) }, '+ Create New')
        ),
        h('div', { className: 'card' },
            h('div', { className: 'table-wrap' },
