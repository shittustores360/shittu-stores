<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--bg4:#222838;
  --border:#2a3040;--border2:#38435a;
  --accent:#f5a623;--accent2:#e8912a;--accent-dim:rgba(245,166,35,0.12);
  --green:#2ecc71;--green-dim:rgba(46,204,113,0.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,0.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,0.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,0.12);
  --text:#e8eaf0;--text2:#9aa0b4;--text3:#5a6070;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:16px;--shadow:0 4px 24px rgba(0,0,0,0.4);--transition:0.18s ease;
}
[data-theme="light"]{
  --bg:#f0f2f7;--bg2:#ffffff;--bg3:#f5f7fb;--bg4:#eaecf3;
  --border:#dde1ef;--border2:#c8cedf;
  --text:#1a1e2e;--text2:#4a5070;--text3:#8890a8;
  --shadow:0 4px 24px rgba(0,0,0,0.1);
  --accent-dim:rgba(245,166,35,0.1);
  --green-dim:rgba(46,204,113,0.1);--red-dim:rgba(231,76,60,0.1);--blue-dim:rgba(52,152,219,0.1);--purple-dim:rgba(155,89,182,0.1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background 0.2s,color 0.2s}
#root{height:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--transition)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}
.sidebar-logo{padding:20px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-text{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.nav-section{padding:8px 8px 0;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(245,166,35,0.2)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);background:var(--bg3)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text)}
.user-role{font-size:10px;color:var(--text3)}
.topbar-title{font-family:var(--font-head);font-size:15px;font-weight:700;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:var(--font-body)}
.btn-primary{background:var(--accent);color:#000}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.2)}.btn-danger:hover{background:rgba(231,76,60,0.2)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(46,204,113,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:50%;opacity:0.06;transform:translate(20px,-20px)}
.stat-card.orange::before{background:var(--accent)}.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}.stat-card.blue::before{background:var(--blue)}.stat-card.purple::before{background:var(--purple)}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.stat-value{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.td-mono{font-family:var(--font-mono);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-delivered{background:var(--green-dim);color:var(--green)}
.badge-canceled{background:var(--red-dim);color:var(--red)}
.badge-rescheduled{background:var(--blue-dim);color:var(--blue)}
.badge-notconfirmed{background:var(--purple-dim);color:var(--purple)}
.badge-noresponse{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-processing{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-confirmed{background:var(--green-dim);color:var(--green)}
.badge-paid{background:var(--green-dim);color:var(--green)}
.badge-unpaid{background:var(--red-dim);color:var(--red)}
.badge-uncontacted{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-contacted{background:var(--blue-dim);color:var(--blue)}
.badge-supplier{background:var(--purple-dim);color:var(--purple)}
.form-grid{display:grid;gap:14px}
.form-grid-2{grid-template-columns:1fr 1fr}.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color var(--transition)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input:disabled,.form-select:disabled{opacity:0.5;cursor:not-allowed}
.form-select option{background:var(--bg3)}.form-textarea{resize:vertical;min-height:70px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-lg{max-width:860px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-title{font-family:var(--font-head);font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg2)}
.close-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;border-radius:6px;line-height:1}
.close-btn:hover{color:var(--text);background:var(--bg3)}
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;width:220px;transition:border-color var(--transition)}
.search-input:focus{border-color:var(--accent)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-logo{font-family:var(--font-head);font-size:28px;font-weight:800;color:var(--accent);margin-bottom:6px}
.login-sub{color:var(--text3);font-size:13px;margin-bottom:32px}
.login-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.25);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px}
.setup-banner{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.25);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.tabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--radius);width:fit-content;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,0.3)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-title{font-family:var(--font-head);font-size:17px;font-weight:700}
.section-sub{font-size:12px;color:var(--text3);margin-top:2px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:var(--shadow);animation:slideIn 0.25s ease;min-width:220px}
.toast.success{border-color:rgba(46,204,113,0.3);color:var(--green)}
.toast.error{border-color:rgba(231,76,60,0.3);color:var(--red)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text3)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:10px}
.empty-icon{font-size:40px;opacity:0.3}.empty-text{font-size:14px}
.profit-positive{color:var(--green);font-family:var(--font-mono);font-size:12px}
.profit-negative{color:var(--red);font-family:var(--font-mono);font-size:12px}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--text3);font-size:12px}
.permission-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.perm-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.perm-chip.active{background:var(--accent-dim);border-color:rgba(245,166,35,0.3);color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid rgba(245,166,35,0.25);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:12px}
.tag-remove{cursor:pointer;line-height:1;opacity:0.7}.tag-remove:hover{opacity:1}
.section-divider{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.alert-info{background:var(--blue-dim);border:1px solid rgba(52,152,219,0.25);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--blue);margin-bottom:12px}
.alert-warning{background:var(--accent-dim);border:1px solid rgba(245,166,35,0.25);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--accent);margin-bottom:12px}
.price-history-item{background:var(--bg3);border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.product-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.product-chip.active{background:var(--blue-dim);border-color:rgba(52,152,219,0.3);color:var(--blue)}
.theme-toggle{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 10px;cursor:pointer;color:var(--text2);font-size:12px;display:flex;align-items:center;gap:5px;transition:all var(--transition)}
.theme-toggle:hover{color:var(--text)}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}
.bar-wrap{background:var(--bg4);border-radius:3px;height:6px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.chart-svg{width:100%;overflow:visible}
.bundle-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;position:relative}
.bundle-row-header{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.bundle-free-gift-row{display:flex;align-items:center;gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.bundle-free-gift-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer}
.bundle-free-gift-row input[type=radio]{accent-color:var(--accent)}
.bundle-gift-cost{display:flex;align-items:center;gap:8px;margin-left:8px}
.bundle-info-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;margin-top:8px}
.bundle-info-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.bundle-info-row:last-child{border-bottom:none;margin-top:4px;padding-top:8px}
.bundle-info-label{color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;font-size:11px}
.bundle-info-value{font-family:var(--font-mono);font-weight:600;color:var(--text)}
.bundle-info-gift{color:var(--green);font-size:11px;display:flex;align-items:center;gap:4px;margin-top:6px}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .hamburger{display:block}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px}
  .filters-bar{flex-direction:column;align-items:stretch}
  .search-input{width:100%}
  .bundle-row-header{flex-direction:column}
}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,useMemo,createContext,useContext} = React;

const _cache = {};
const _inflight = {};
const CACHE_TTL = 90000;

function cacheGet(k){ const e=_cache[k]; if(e)return e; return null; }
function cacheSet(k,v){ _cache[k]={v,ts:Date.now()}; }
function cacheBust(keys){ 
  if(keys){ keys.forEach(k=>{ Object.keys(_cache).forEach(ck=>{ if(ck.includes(k))delete _cache[ck]; }); }); }
  else { Object.keys(_cache).forEach(k=>delete _cache[k]); }
}

const BUST_MAP = {
  addOrder:['getOrders','getDashboard','getMyDashboard'],
  updateOrder:['getOrders','getDashboard','getMyDashboard'],
  deleteOrder:['getOrders','getDashboard','getMyDashboard'],
  addProduct:['getProducts'],updateProduct:['getProducts'],deleteProduct:['getProducts'],
  addStaff:['getStaff'],updateStaff:['getStaff'],deleteStaff:['getStaff'],
  addSupplier:['getSuppliers'],updateSupplier:['getSuppliers'],deleteSupplier:['getSuppliers'],
  addExpense:['getExpenses'],deleteExpense:['getExpenses'],
  addWithdrawal:['getWithdrawals'],
  addPayoutRecord:['getPayoutRecords','getDashboard'],
};

const API = {
  url: localStorage.getItem('apiUrl')||'',
  setUrl(u){ this.url=u; localStorage.setItem('apiUrl',u); },
  async call(params){
    if(!this.url) return {success:false,error:'No API URL. Go to Settings.'};
    const key = JSON.stringify(params);
    const action = params.action||'';
    const isRead = action.startsWith('get')||action.startsWith('fetch');
    if(isRead){ 
      const c=cacheGet(key); 
      if(c && Date.now()-c.ts < CACHE_TTL) return {success:true,data:c.v,_cached:true}; 
    }
    if(isRead && _inflight[key]){ return _inflight[key]; }
    const promise = this._fetch(params, key, isRead);
    if(isRead) _inflight[key] = promise;
    try {
      const result = await promise;
      return result;
    } finally {
      if(isRead) delete _inflight[key];
    }
  },
  async _fetch(params, key, isRead){
    try{
      const r=await fetch(this.url,{
        method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(params)
      });
      if(!r.ok) return {success:false,error:`HTTP ${r.status}`};
      const text=await r.text();
      let data; try{data=JSON.parse(text);}catch{return{success:false,error:'Bad response: '+text.slice(0,80)};}
      if(isRead && data.success) cacheSet(key, data.data||[]);
      if(!isRead && data.success){ 
        const busted=BUST_MAP[params.action];
        cacheBust(busted);
      }
      return data;
    }catch(e){ return {success:false,error:e.message}; }
  },
  prefetch(action){
    if(!this.url) return;
    const params={action};
    const key=JSON.stringify(params);
    const c=cacheGet(key);
    if(c && Date.now()-c.ts<CACHE_TTL) return;
    this.call(params);
  }
};

const ThemeCtx = createContext({theme:'dark',toggleTheme:()=>{}});
function ThemeProvider({children}){
  const [theme,setTheme]=useState(()=>localStorage.getItem('ssTheme')||'dark');
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme==='light'?'light':'');
    localStorage.setItem('ssTheme',theme);
  },[theme]);
  const toggleTheme=useCallback(()=>setTheme(t=>t==='dark'?'light':'dark'),[]);
  return React.createElement(ThemeCtx.Provider,{value:{theme,toggleTheme}},children);
}

let _toastFn=null;
function useToast(){
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{
    _toastFn=(msg,type='success')=>{
      const id=Date.now();
      setToasts(t=>[...t,{id,msg,type}]);
      setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3000);
    };
  },[]);
  return toasts;
}
const toast=(msg,type)=>_toastFn&&_toastFn(msg,type);

const DELIVERY_STATUSES=['Not Confirmed','Processing','Rescheduled','Confirmed','Delivered','Canceled','No Response'];
const CONTACT_STATUSES=['Uncontacted','Contacted'];
const PAYMENT_OPTIONS=['Paid','Unpaid'];
const PERMS_LIST=['view_orders','add_orders','edit_orders','delete_orders','view_financials','view_dashboard','manage_expenses'];
const STAFF_PAYOUT_NGN=2000;

function sp(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function fmt(n,d=2){const v=parseFloat(n);return isNaN(v)?'—':v.toFixed(d);}
function fmtGHC(n){return `GH₵${fmt(n,2)}`;}
function fmtNGN(n){const v=parseFloat(n);return isNaN(v)?'—':`₦${v.toLocaleString('en-NG',{maximumFractionDigits:0})}`;}
function today(){return new Date().toISOString().split('T')[0];}
function statusBadge(s){
  const m={'Delivered':'badge-delivered','Canceled':'badge-canceled','Rescheduled':'badge-rescheduled','Not Confirmed':'badge-notconfirmed','No Response':'badge-noresponse','Processing':'badge-processing','Confirmed':'badge-confirmed'};
  return React.createElement('span',{className:`badge ${m[s]||'badge-noresponse'}`},s||'—');
}
function contactBadge(s){return React.createElement('span',{className:`badge ${s==='Contacted'?'badge-contacted':'badge-uncontacted'}`},s||'Uncontacted');}
function payBadge(s){return React.createElement('span',{className:`badge ${s==='Paid'?'badge-paid':'badge-unpaid'}`},s||'Unpaid');}
function isActive(x){return x===true||x==='TRUE'||x==='true';}
function statusOf(o){return o?.deliveryStatus||o?.status||'Not Confirmed';}
function paymentOf(o){return o?.paymentStatus||'Unpaid';}
function readList(v){
  if(Array.isArray(v))return v;
  if(!v)return [];
  try{const p=JSON.parse(v);return Array.isArray(p)?p:[];}catch{}
  return String(v).split(',').map(x=>x.trim()).filter(Boolean);
}
function supplierOwnsOrder(order,products,user){
  if(!user||user.role!=='supplier')return true;
  const product=products.find(p=>p.name===order.product);
  const assigned=readList(user.assignedProducts||user.products||user.productNames);
  const productSuppliers=readList(product?.supplierUsernames||product?.suppliers);
  return order.supplierUsername===user.username||order.supplier===user.username||
    product?.supplierUsername===user.username||productSuppliers.includes(user.username)||
    assigned.includes(order.product);
}

function useData(action,enabled=true){
  const [data,setData]=useState(()=>{
    if(!enabled||!API.url) return null;
    const cached=cacheGet(JSON.stringify({action}));
    return cached?cached.v:null;
  });
  const [loading,setLoading]=useState(()=>{
    if(!enabled||!API.url) return false;
    const cached=cacheGet(JSON.stringify({action}));
    return !cached;
  });
  const [error,setError]=useState('');
  
  const load=useCallback(async(forceRefresh=false)=>{
    if(!enabled){setLoading(false);return;}
    if(!API.url){setLoading(false);return;}
    const cached=cacheGet(JSON.stringify({action}));
    if(cached && !forceRefresh){
      setData(cached.v);
      setLoading(false);
      if(Date.now()-cached.ts > CACHE_TTL/2){
        API.call({action}).then(r=>{ if(r.success&&!r._cached) setData(r.data||[]); });
      }
      return;
    }
    setLoading(true);setError('');
    const r=await API.call({action});
    setLoading(false);
    if(r.success)setData(r.data||[]);
    else setError(r.error||'Failed');
  },[action,enabled]);
  
  useEffect(()=>{load();},[load]);
  return {data,loading,error,reload:()=>load(true),setData};
}

function BarChart({data,color='var(--accent)',height=80}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d.value),1);
  const w=100/data.length;
  return React.createElement('svg',{viewBox:`0 0 100 ${height}`,className:'chart-svg',style:{height}},
    data.map((d,i)=>{
      const bh=Math.max(2,(d.value/max)*(height-18));
      const x=i*w+w*0.1;
      const bw=w*0.8;
      const y=height-bh-12;
      return React.createElement('g',{key:i},
        React.createElement('rect',{x,y,width:bw,height:bh,fill:color,rx:2,opacity:0.85}),
        React.createElement('text',{x:x+bw/2,y:height-1,textAnchor:'middle',fontSize:5,fill:'var(--text3)'},d.label)
      );
    })
  );
}

function LineChart({data,color='var(--accent)',height=80}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data.map(d=>d.value),1);
  const pts=data.map((d,i)=>{
    const x=i*(100/(data.length-1));
    const y=height-12-(d.value/max)*(height-20);
    return [x,y];
  });
  const path='M'+pts.map(p=>p.join(',')).join(' L');
  const areaPath=path+` L${pts[pts.length-1][0]},${height-12} L${pts[0][0]},${height-12} Z`;
  return React.createElement('svg',{viewBox:`0 0 100 ${height}`,className:'chart-svg',style:{height}},
    React.createElement('defs',null,
      React.createElement('linearGradient',{id:'lg',x1:'0',y1:'0',x2:'0',y2:'1'},
        React.createElement('stop',{offset:'0%',stopColor:color,stopOpacity:0.3}),
        React.createElement('stop',{offset:'100%',stopColor:color,stopOpacity:0.02})
      )
    ),
    React.createElement('path',{d:areaPath,fill:'url(#lg)'}),
    React.createElement('path',{d:path,fill:'none',stroke:color,strokeWidth:1.5,strokeLinejoin:'round'}),
    pts.map((p,i)=>React.createElement('circle',{key:i,cx:p[0],cy:p[1],r:1.5,fill:color})),
    data.map((d,i)=>React.createElement('text',{key:i,x:pts[i][0],y:height-1,textAnchor:'middle',fontSize:5,fill:'var(--text3)'},d.label))
  );
}

      const key=dt.toISOString().slice(0,7);
      const lbl=dt.toLocaleString('default',{month:'short'});
      months.push({key,label:lbl,value:0,delivered:0});
    }
    (d.recentOrders||[]).forEach(o=>{
      const mk=(o.date||'').slice(0,7);
      const m=months.find(x=>x.key===mk);
      if(m){m.value++;if(statusOf(o)==='Delivered')m.delivered++;}

  const prod=useMemo(()=>products.find(p=>p.name===f.product),[f.product,products]);
  const bundles=useMemo(()=>{try{return JSON.parse(prod&&prod.bundles||'[]');}catch{return[];}},[prod]);
  const sizes=useMemo(()=>{
    if(!prod||(prod.hasSizes!==true&&prod.hasSizes!=='true'))return[];
    try{return JSON.parse(prod&&prod.sizes||'[]');}catch{return[];}
  },[prod]);

  const prevProduct=useRef(f.product);

    if(prod){
      const supplierUsernames=readList(prod.supplierUsernames||prod.supplierUsername);
      setF(p=>({...p,bundleLabel:'',qty:'',sellingPrice:'',costOfProduct:'',isCustom:false,
        supplierUsername:supplierUsernames[0]||prod.supplierUsername||''
      }));
    }
  },[f.product,prod,isEdit]);

  const isCustom=f.bundleLabel==='__custom__'||f.isCustom;
  
  const selectedBundle=useMemo(()=>{

  const pickBundle=sel=>{

      return;

    const b=bundles.find(x=>x.label===sel);

    const supplierUsernames=readList(prod&&prod.supplierUsernames||prod&&prod.supplierUsername);
    setF(p=>({...p,
      bundleLabel:b.label,
      qty:b.qty,
      sellingPrice:b.sellingPrice||b.price||'',

    if(!f.product){toast('Product required','error');return false;}
    if(bundles.length>0&&!f.bundleLabel){toast('Please select a bundle','error');return false;}
    if(sizes.length>0&&!f.size){toast('Please select a size','error');return false;}
    if(isCustom){
      if(!f.qty){toast('Quantity required for custom bundle','error');return false;}
      if(!f.deliveryPrice){toast('Delivery price required for custom bundle','error');return false;}
      if(!f.notes){toast('Notes required for custom bundle','error');return false;}
    }
    return true;
  };

  const save=async()=>{
    if(!validate())return;
    setSaving(true);
    const payload={...f,bundleLabel:isCustom?`Custom x${f.qty}`:f.bundleLabel};

        React.createElement('div',{className:'section-divider'},'Customer'),
        React.createElement('div',{className:'form-group',style:{marginBottom:12}},
          React.createElement('label',{className:'form-label'},'Order Date *'),
          React.createElement('input',{className:'form-input',type:'date',value:f.date||'',onChange:set('date')})
        ),
        React.createElement('div',{className:'form-grid form-grid-2',style:{marginBottom:14}},
          React.createElement('div',{className:'form-group'},
            React.createElement('label',{className:'form-label'},'Customer Name *'),

function StaffPayoutTable({orders,payoutRecords,isAdmin,onPaid}){
  const byStaff={};
  orders.forEach(o=>{
    const n=o.contactedBy;if(!n)return;
    if(!byStaff[n])byStaff[n]={name:n,earned:0,pending:0,count:0};
    const isPaid=paymentOf(o)==='Paid';
    const isDel=statusOf(o)==='Delivered';
    if(isDel&&isPaid){byStaff[n].earned+=STAFF_PAYOUT_NGN;byStaff[n].count++;}
    else if(isDel&&!isPaid)byStaff[n].pending+=STAFF_PAYOUT_NGN;
  });
  const paidOut={};
  (payoutRecords||[]).forEach(r=>{paidOut[r.staffName]=(paidOut[r.staffName]||0)+sp(r.amountNGN);});
  const rows=Object.values(byStaff);
  if(rows.length===0)return React.createElement('div',{className:'text-muted',style:{padding:12}},'No payout data yet.');
  return React.createElement('div',{className:'table-wrap'},
    React.createElement('table',null,

        ['Staff','Deliveries','Earned (NGN)','Pending (NGN)','Paid Out (NGN)','Unpaid Balance',...(isAdmin?['Action']:[])].map(h=>React.createElement('th',{key:h},h))
      )),

            React.createElement('td',{style:{color:'var(--green)',fontFamily:'var(--font-mono)',fontSize:12}},fmtNGN(paid)),
            React.createElement('td',{className:balance>0?'profit-negative':'profit-positive'},fmtNGN(balance)),
            ...(isAdmin?[React.createElement('td',{key:'act'},

            )]:[] )
          );
        })

        React.createElement('button',{className:'btn btn-primary',onClick:save,disabled:saving},'Save')
      )
    )
  );
}

function SuppliersPage(){
  const [suppliers,setSuppliers]=useState([]);
  const [products,setProducts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showModal,setShowModal]=useState(false);
  const [editing,setEditing]=useState(null);

  const load=useCallback(async()=>{
    try{
      setLoading(true);

      const [su,pr]=await Promise.all([
        API.call({action:'getSuppliers'}),
        API.call({action:'getProducts'})
      ]);

      setSuppliers(
        su && su.success && Array.isArray(su.data)
          ? su.data
          : []
      );

      setProducts(
        pr && pr.success && Array.isArray(pr.data)
          ? pr.data
          : []
      );

    }catch(err){
      console.error('Suppliers load error:',err);
      setSuppliers([]);
      setProducts([]);
    }finally{
      setLoading(false);
    }
  },[]);

  useEffect(()=>{load();},[load]);

  const del=async s=>{
    if(!confirm(`Remove supplier ${s.name||s.username}?`)) return;

    try{
      const r=await API.call({
        action:'deleteSupplier',
        id:s.id
      });

      if(r.success){
        toast('Removed');
        load();
      }else{
        toast(r.error||'Failed','error');
      }
    }catch(err){
      console.error(err);
      toast('Delete failed','error');
    }
  };

  return React.createElement('div',null,
    React.createElement('div',{className:'section-header'},
      React.createElement('div',{className:'section-title'},'Suppliers'),
      React.createElement('button',{
        className:'btn btn-primary',
        onClick:()=>{
          setEditing(null);
          setShowModal(true);
        }
      },'+ Add Supplier')
    ),

    loading
      ? React.createElement('div',{className:'loading-full'},
          React.createElement('div',{className:'spinner'})
        )

      : suppliers.length===0
        ? React.createElement('div',{className:'empty-state'},
            React.createElement('div',{className:'empty-text'},
              'No suppliers yet'
            )
          )

        : React.createElement('div',{className:'table-wrap'},
            React.createElement('table',null,

              React.createElement('thead',null,
                React.createElement('tr',null,
                  ['Name','Username','Products','Status','Actions']
                    .map(h=>React.createElement('th',{key:h},h))
                )
              ),

              React.createElement('tbody',null,

                (Array.isArray(suppliers)?suppliers:[]).map(s=>{

                  const assigned=Array.isArray(
                    readList(
                      s?.assignedProducts || s?.products
                    )
                  )
                    ? readList(
                        s?.assignedProducts || s?.products
                      )
                    : [];

                  return React.createElement('tr',{
                    key:s.id||s.username
                  },

                    React.createElement(
                      'td',
                      null,
                      s?.name || '-'
                    ),

                    React.createElement(
                      'td',
                      {className:'td-mono'},
                      s?.username || '-'
                    ),

                    React.createElement(
                      'td',
                      null,
                      assigned.length
                        ? assigned.join(', ')
                        : 'None'
                    ),

                    React.createElement(
                      'td',
                      null,
                      React.createElement(
                        'span',
                        {
                          className:`badge ${
                            isActive(s?.active)
                              ? 'badge-delivered'
                              : 'badge-canceled'
                          }`
                        },
                        isActive(s?.active)
                          ? 'Active'
                          : 'Inactive'
                      )
                    ),

                    React.createElement(
                      'td',
                      null,
                      React.createElement(
                        'div',
                        {
                          style:{
                            display:'flex',
                            gap:4
                          }
                        },

                        React.createElement(
                          'button',
                          {
                            className:'btn btn-secondary btn-sm',
                            onClick:()=>{
                              setEditing(s);
                              setShowModal(true);
                            }
                          },
                          'Edit'
                        ),

                        React.createElement(
                          'button',
                          {
                            className:'btn btn-danger btn-sm',
                            onClick:()=>del(s)
                          },
                          'Delete'
                        )
                      )
                    )
                  );
                })
              )
            )
          ),

    showModal &&
      React.createElement(
        SupplierModal,
        {
          supplier:editing,
          products:Array.isArray(products)
            ? products
            : [],
          onSave:()=>{
            setShowModal(false);
            load();
            toast('Saved');
          },
          onClose:()=>setShowModal(false)
        }
      )
  );
}
  return React.createElement('div',null,
    React.createElement('div',{className:'section-header'},
      React.createElement('div',{className:'section-title'},'Suppliers'),
      React.createElement('button',{className:'btn btn-primary',onClick:()=>{setEditing(null);setShowModal(true);}},'+ Add Supplier')
    ),
    loading?React.createElement('div',{className:'loading-full'},React.createElement('div',{className:'spinner'})):
    suppliers.length===0?React.createElement('div',{className:'empty-state'},React.createElement('div',{className:'empty-text'},'No suppliers yet')):
    React.createElement('div',{className:'table-wrap'},
      React.createElement('table',null,
        React.createElement('thead',null,React.createElement('tr',null,['Name','Username','Products','Status','Actions'].map(h=>React.createElement('th',{key:h},h)))),
        React.createElement('tbody',null,
          suppliers.map(s=>{
            const assigned=readList(s.assignedProducts||s.products);
            return React.createElement('tr',{key:s.id||s.username},
              React.createElement('td',null,s.name||'-'),
              React.createElement('td',{className:'td-mono'},s.username),
              React.createElement('td',null,assigned.join(', ')),
              React.createElement('td',null,React.createElement('span',{className:`badge ${isActive(s.active)?'badge-delivered':'badge-canceled'}`},isActive(s.active)?'Active':'Inactive')),
              React.createElement('td',null,
                React.createElement('div',{style:{display:'flex',gap:4}},
                  React.createElement('button',{className:'btn btn-secondary btn-sm',onClick:()=>{setEditing(s);setShowModal(true);}},'Edit'),
                  React.createElement('button',{className:'btn btn-danger btn-sm',onClick:()=>del(s)},'Delete')
                )
              )
            );
          })
        )
      )
    ),
    showModal&&React.createElement(SupplierModal,{supplier:editing,products,onSave:()=>{setShowModal(false);load();toast('Saved');},onClose:()=>setShowModal(false)})
  );
}

function SupplierModal({supplier,products,onSave,onClose}){
  const isEdit=!!supplier;
  const [f,setF]=useState(supplier?{...supplier}:{name:'',username:'',password:'',active:true});
  const [selected,setSelected]=useState(()=>readList(supplier&&supplier.assignedProducts||supplier&&supplier.products));
  const [saving,setSaving]=useState(false);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const toggleProduct=name=>setSelected(prev=>prev.includes(name)?prev.filter(x=>x!==name):[...prev,name]);
  const save=async()=>{
    const data={...f,role:'supplier',assignedProducts:JSON.stringify(selected),products:selected.join(',')};
    setSaving(true);
    const r=await API.call(isEdit?{action:'updateSupplier',id:supplier.id,supplier:JSON.stringify(data)}:{action:'addSupplier',supplier:JSON.stringify(data)});
    setSaving(false);
    if(r.success)onSave();else toast(r.error||'Failed','error');
  };
  return React.createElement('div',{className:'modal-overlay',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    React.createElement('div',{className:'modal'},
      React.createElement('div',{className:'modal-header'},
        React.createElement('div',{className:'modal-title'},isEdit?'Edit':'Add'),
        React.createElement('button',{className:'close-btn',onClick:onClose},'×')
      ),
      React.createElement('div',{className:'modal-body'},
        React.createElement('div',{className:'form-grid form-grid-2',style:{marginBottom:14}},
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Name'),React.createElement('input',{className:'form-input',value:f.name||'',onChange:set('name')})),
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Username'),React.createElement('input',{className:'form-input',value:f.username||'',onChange:set('username')})),
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Password'),React.createElement('input',{className:'form-input',type:'text',value:f.password||'',onChange:set('password')}))
        ),
        React.createElement('div',{className:'form-group'},
          React.createElement('label',{className:'form-label'},'Products'),
          React.createElement('div',{className:'permission-grid'},
            (products || []).map(p=>React.createElement('div',{key:p.name,className:`product-chip ${selected.includes(p.name)?'active':''}`,onClick:()=>toggleProduct(p.name)},p.name))
          )
        )
      ),
      React.createElement('div',{className:'modal-footer'},
        React.createElement('button',{className:'btn btn-secondary',onClick:onClose},'Cancel'),
        React.createElement('button',{className:'btn btn-primary',onClick:save,disabled:saving},'Save')
      )
    )
  );
}

function SettingsPage({user}){
  const [url,setUrl]=useState(API.url||'');
  const [saved,setSaved]=useState(false);
  const [pw,setPw]=useState({oldPassword:'',newPassword:'',confirmPassword:''});
  const [savingPw,setSavingPw]=useState(false);
  const setPwField=k=>e=>setPw(p=>({...p,[k]:e.target.value}));
  const saveUrl=()=>{API.setUrl(url.trim());setSaved(true);toast('API URL saved');setTimeout(()=>setSaved(false),1800);};
  const changePassword=async()=>{
    if(pw.newPassword!==pw.confirmPassword){toast('Passwords mismatch','error');return;}
    setSavingPw(true);
    const r=await API.call({action:'changePassword',username:user.username,role:user.role,oldPassword:pw.oldPassword,newPassword:pw.newPassword});
    setSavingPw(false);
    if(r.success){toast('Password changed');setPw({oldPassword:'',newPassword:'',confirmPassword:''});}
    else toast(r.error||'Failed','error');
  };

  return React.createElement('div',null,
    React.createElement('div',{className:'card',style:{marginBottom:20}},
      React.createElement('div',{className:'section-title',style:{marginBottom:12}},'Database Connection'),
      React.createElement('div',{className:'form-group',style:{marginBottom:12}},
        React.createElement('label',{className:'form-label'},'Apps Script URL'),
        React.createElement('input',{className:'form-input',value:url,onChange:e=>setUrl(e.target.value)})
      ),
      React.createElement('button',{className:'btn btn-primary',onClick:saveUrl},saved?'✓ Saved':'Save URL')
    ),
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'section-title',style:{marginBottom:12}},'Account Password'),
      React.createElement('div',{className:'form-grid form-grid-3'},
        React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Old'),React.createElement('input',{className:'form-input',type:'password',value:pw.oldPassword,onChange:setPwField('oldPassword')})),
        React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'New'),React.createElement('input',{className:'form-input',type:'password',value:pw.newPassword,onChange:setPwField('newPassword')})),
        React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Confirm'),React.createElement('input',{className:'form-input',type:'password',value:pw.confirmPassword,onChange:setPwField('confirmPassword')}))
      ),
      React.createElement('div',{style:{display:'flex',justifyContent:'flex-end',marginTop:14}},
        React.createElement('button',{className:'btn btn-primary',onClick:changePassword,disabled:savingPw},'Change Password')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
