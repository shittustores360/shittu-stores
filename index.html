<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a623">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shittu Stores">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--bg4:#222838;
  --border:#2a3040;--border2:#38435a;
  --accent:#f5a623;--accent2:#e8912a;--accent-dim:rgba(245,166,35,0.12);
  --green:#2ecc71;--green-dim:rgba(46,204,113,0.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,0.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,0.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,0.12);
  --text:#e8eaf0;--text2:#9aa0b4;--text3:#5a6070;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:16px;--shadow:0 4px 24px rgba(0,0,0,0.4);--transition:0.18s ease;
}
[data-theme="light"]{
  --bg:#f0f2f7;--bg2:#ffffff;--bg3:#f5f7fb;--bg4:#eaecf3;
  --border:#dde1ef;--border2:#c8cedf;
  --text:#1a1e2e;--text2:#4a5070;--text3:#8890a8;
  --shadow:0 4px 24px rgba(0,0,0,0.1);
  --accent-dim:rgba(245,166,35,0.1);
  --green-dim:rgba(46,204,113,0.1);--red-dim:rgba(231,76,60,0.1);--blue-dim:rgba(52,152,219,0.1);--purple-dim:rgba(155,89,182,0.1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background 0.2s,color 0.2s}
#root{height:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--transition)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}
.sidebar-logo{padding:20px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-text{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.nav-section{padding:8px 8px 0;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(245,166,35,0.2)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);background:var(--bg3)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text)}
.user-role{font-size:10px;color:var(--text3)}
.topbar-title{font-family:var(--font-head);font-size:15px;font-weight:700;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:var(--font-body)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#000}.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover:not(:disabled){background:var(--bg4)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.2)}.btn-danger:hover:not(:disabled){background:rgba(231,76,60,0.2)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(46,204,113,0.2)}
.btn-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(52,152,219,0.2)}.btn-blue:hover:not(:disabled){background:rgba(52,152,219,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 7px;font-size:11px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:50%;opacity:0.06;transform:translate(20px,-20px)}
.stat-card.orange::before{background:var(--accent)}.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}.stat-card.blue::before{background:var(--blue)}.stat-card.purple::before{background:var(--purple)}
.stat-card.clickable{cursor:pointer;transition:all var(--transition)}
.stat-card.clickable:hover{border-color:var(--accent);box-shadow:0 0 0 2px rgba(245,166,35,0.15)}
.stat-card.featured{grid-column:span 2;border:1.5px solid rgba(245,166,35,0.35);background:linear-gradient(135deg,rgba(245,166,35,0.08),var(--bg2) 60%)}
.stat-card.featured .stat-value{font-size:28px}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.stat-value{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}
.stat-click-hint{font-size:10px;color:var(--accent);margin-top:6px;opacity:0.85;font-weight:600}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.td-mono{font-family:var(--font-mono);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-delivered{background:var(--green-dim);color:var(--green)}
.badge-canceled{background:var(--red-dim);color:var(--red)}
.badge-rescheduled{background:var(--blue-dim);color:var(--blue)}
.badge-notconfirmed{background:var(--purple-dim);color:var(--purple)}
.badge-noresponse{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-processing{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-confirmed{background:var(--green-dim);color:var(--green)}
.badge-paid{background:var(--green-dim);color:var(--green)}
.badge-unpaid{background:var(--red-dim);color:var(--red)}
.badge-uncontacted{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-contacted{background:var(--blue-dim);color:var(--blue)}
.badge-supplier{background:var(--purple-dim);color:var(--purple)}
.badge-unassigned{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-email-set{background:var(--green-dim);color:var(--green)}
.badge-email-missing{background:var(--red-dim);color:var(--red)}
.badge-ready{background:var(--green-dim);color:var(--green)}
.badge-notready{background:rgba(245,166,35,0.15);color:var(--accent)}
.form-grid{display:grid;gap:14px}
.form-grid-2{grid-template-columns:1fr 1fr}.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color var(--transition)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input:disabled,.form-select:disabled{opacity:0.5;cursor:not-allowed}
.form-select option{background:var(--bg3)}.form-textarea{resize:vertical;min-height:70px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-lg{max-width:860px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-title{font-family:var(--font-head);font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg2)}
.close-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;border-radius:6px;line-height:1}
.close-btn:hover{color:var(--text);background:var(--bg3)}
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;width:220px;transition:border-color var(--transition)}
.search-input:focus{border-color:var(--accent)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-logo{font-family:var(--font-head);font-size:28px;font-weight:800;color:var(--accent);margin-bottom:6px}
.login-sub{color:var(--text3);font-size:13px;margin-bottom:32px}
.login-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.25);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px}
.signup-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(46,204,113,0.25);border-radius:var(--radius);padding:14px;font-size:13px;margin-bottom:16px;text-align:center}
.tabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--radius);width:fit-content;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,0.3)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-title{font-family:var(--font-head);font-size:17px;font-weight:700}
.section-sub{font-size:12px;color:var(--text3);margin-top:2px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:var(--shadow);animation:slideIn 0.25s ease;min-width:220px}
.toast.success{border-color:rgba(46,204,113,0.3);color:var(--green)}
.toast.error{border-color:rgba(231,76,60,0.3);color:var(--red)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:currentColor;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text3)}
.loading-full .spinner{width:28px;height:28px;border-width:3px;border-color:var(--border2);border-top-color:var(--accent)}
.loading-label{font-size:13px;color:var(--text3);margin-top:4px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:10px}
.empty-icon{font-size:40px;opacity:0.3}.empty-text{font-size:14px}
.profit-positive{color:var(--green);font-family:var(--font-mono);font-size:12px}
.profit-negative{color:var(--red);font-family:var(--font-mono);font-size:12px}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--text3);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid rgba(245,166,35,0.25);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:12px}
.tag-remove{cursor:pointer;line-height:1;opacity:0.7}.tag-remove:hover{opacity:1}
.section-divider{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.alert-info{background:var(--blue-dim);border:1px solid rgba(52,152,219,0.25);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--blue);margin-bottom:12px}
.alert-warning{background:var(--accent-dim);border:1px solid rgba(245,166,35,0.25);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--accent);margin-bottom:12px}
.alert-success{background:var(--green-dim);border:1px solid rgba(46,204,113,0.25);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--green);margin-bottom:12px}
.product-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.product-chip.active{background:var(--blue-dim);border-color:rgba(52,152,219,0.3);color:var(--blue)}
.theme-toggle{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 10px;cursor:pointer;color:var(--text2);font-size:12px;display:flex;align-items:center;gap:5px;transition:all var(--transition)}
.theme-toggle:hover{color:var(--text)}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}
.bar-wrap{background:var(--bg4);border-radius:3px;height:6px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.chart-svg{width:100%;overflow:visible}
.bundle-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;position:relative}
.bundle-row-header{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.bundle-free-gift-row{display:flex;align-items:center;gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.bundle-free-gift-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer}
.bundle-free-gift-row input[type=radio]{accent-color:var(--accent)}
.bundle-gift-cost{display:flex;align-items:center;gap:8px;margin-left:8px}
.bundle-info-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;margin-top:8px}
.bundle-info-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.bundle-info-row:last-child{border-bottom:none;margin-top:4px;padding-top:8px}
.bundle-info-label{color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;font-size:11px}
.bundle-info-value{font-family:var(--font-mono);font-weight:600;color:var(--text)}
.bundle-info-gift{color:var(--green);font-size:11px;display:flex;align-items:center;gap:4px;margin-top:6px}
.signup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.signup-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:460px;box-shadow:var(--shadow)}
.copy-link-box{display:flex;gap:8px;align-items:center;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-mono);font-size:11px;color:var(--text2);word-break:break-all;margin-bottom:8px}
.copy-link-btn{flex-shrink:0;background:var(--accent-dim);border:1px solid rgba(245,166,35,0.3);color:var(--accent);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.copy-link-btn:hover{background:rgba(245,166,35,0.25)}
.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.save-overlay-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:28px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow)}
.save-overlay-box .spinner{width:36px;height:36px;border-width:3px;border-color:var(--border2);border-top-color:var(--accent)}
.save-overlay-label{font-size:14px;color:var(--text2);font-weight:600}
.email-row{display:flex;gap:8px;align-items:center}
.email-row .form-input{flex:1}
.form-url-wrap{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.product-link-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.product-link-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.product-link-meta{font-size:11px;color:var(--text3);margin-bottom:8px}
.cc-info-box{background:linear-gradient(135deg,rgba(52,152,219,0.08),rgba(52,152,219,0.03));border:1px solid rgba(52,152,219,0.2);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px}
.cc-info-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cc-info-text{font-size:12px;color:var(--text2);line-height:1.6}
.copy-btn-row{display:flex;gap:3px;margin-top:4px}
.copy-detail-btn{background:none;border:1px solid var(--border2);border-radius:5px;color:var(--text3);font-size:10px;padding:2px 6px;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.copy-detail-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:rgba(245,166,35,0.3)}
.copy-detail-btn.copied{background:var(--green-dim);color:var(--green);border-color:rgba(46,204,113,0.3)}
.gmail-connect-card{background:linear-gradient(135deg,rgba(46,204,113,0.06),rgba(46,204,113,0.02));border:1px solid rgba(46,204,113,0.2);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px}
.gmail-connect-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:6px;display:flex;align-items:center;gap:6px}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
const SITE_API_URL = 'https://script.google.com/macros/s/AKfycbwxdGslHWScLe-l3lNt1SJLx_AbveynGvu-y7RwGkUemxhc_zRGBU7kPo5ZpDe6b1C8/exec';

const {useState,useEffect,useCallback,useRef,useMemo,createContext,useContext} = React;

// ─── CACHE ────────────────────────────────────────────────────
const _cache={};const _inflight={};const CACHE_TTL=90000;
function cacheGet(k){const c=_cache[k];return(c&&Date.now()-c.ts<CACHE_TTL)?c:null;}
function cacheSet(k,v){_cache[k]={v,ts:Date.now()};}
function cacheBust(keys){
  if(keys){keys.forEach(k=>{Object.keys(_cache).forEach(ck=>{if(ck.includes(k))delete _cache[ck];});});}
  else{Object.keys(_cache).forEach(k=>delete _cache[k]);}
}
const BUST_MAP={
  addOrder:['getOrders','getDashboard','getMyDashboard'],
  updateOrder:['getOrders','getDashboard','getMyDashboard'],
  deleteOrder:['getOrders','getDashboard','getMyDashboard'],
  addProduct:['getProducts'],updateProduct:['getProducts'],deleteProduct:['getProducts'],
  saveThankYouUrl:['getProducts'],
  addStaff:['getStaff'],updateStaff:['getStaff'],deleteStaff:['getStaff'],
  addSupplier:['getSuppliers'],updateSupplier:['getSuppliers'],deleteSupplier:['getSuppliers'],
  addExpense:['getExpenses','getDashboard'],deleteExpense:['getExpenses','getDashboard'],
  addWithdrawal:['getWithdrawals','getDashboard'],
  addPayoutRecord:['getPayoutRecords','getDashboard','getMyDashboard'],
  signupSupplier:['getSuppliers'],signupStaff:['getStaff'],
  saveEmail:['getStaff','getSuppliers','getEmailSettings'],
  sendManualEmail:[],
};

const API={
  get url(){return localStorage.getItem('apiUrl')||SITE_API_URL||'';}
  ,setUrl(u){if(u){localStorage.setItem('apiUrl',u);}else{localStorage.removeItem('apiUrl');}}
  ,async call(params){
    const url=this.url;if(!url)return{success:false,error:'API not configured.'};
    const key=JSON.stringify(params);const action=params.action||'';const isRead=action.startsWith('get');
    if(isRead){const c=cacheGet(key);if(c)return{success:true,data:c.v,_cached:true};}
    if(isRead&&_inflight[key])return _inflight[key];
    const promise=this._fetch(params,key,isRead,url);
    if(isRead)_inflight[key]=promise;
    try{const r=await promise;return r;}finally{if(isRead)delete _inflight[key];}
  }
  ,async _fetch(params,key,isRead,url){
    try{
      const r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(params)});
      if(!r.ok)return{success:false,error:`HTTP ${r.status}`};
      const text=await r.text();let data;
      try{data=JSON.parse(text);}catch{return{success:false,error:'Bad response: '+text.slice(0,80)};}
      if(isRead&&data.success)cacheSet(key,data.data||[]);
      if(!isRead&&data.success){const busted=BUST_MAP[params.action];cacheBust(busted);}
      return data;
    }catch(e){return{success:false,error:e.message};}
  }
  ,prefetch(action){const url=this.url;if(!url)return;const params={action};const key=JSON.stringify(params);const c=cacheGet(key);if(c)return;this.call(params);}
};

// ─── THANK-YOU URL ───────────────────────────────────────────
function getTyUrl(product){return (product&&product.thankYouUrl)?String(product.thankYouUrl).trim():'';}

// ─── EMAILJS LOGIN ALERTS ─────────────────────────────────────
// Optional, free, client-side login-alert email. Uses MailApp-free EmailJS
// (https://www.emailjs.com — free tier ~200 emails/month) ONLY if the admin
// has configured a Service ID / Template ID / Public Key under
// Settings → Login Alerts. If not configured, this silently does nothing —
// the platform does not depend on EmailJS for anything else (all other
// emails are sent for free via the Apps Script backend's MailApp).
function getEmailJsConfig(){
  try{return JSON.parse(localStorage.getItem('ssEmailJsConfig')||'{}');}catch{return{};}
}
function saveEmailJsConfig(cfg){localStorage.setItem('ssEmailJsConfig',JSON.stringify(cfg||{}));}
function sendLoginAlert(user){
  try{
    const cfg=getEmailJsConfig();
    if(!cfg.enabled||!cfg.serviceId||!cfg.templateId||!cfg.publicKey||!cfg.alertEmail)return;
    if(typeof emailjs==='undefined')return;
    emailjs.send(cfg.serviceId,cfg.templateId,{
      to_email:cfg.alertEmail,
      user_name:user.name||user.username,
      user_role:user.role,
      login_time:new Date().toLocaleString(),
    },{publicKey:cfg.publicKey}).catch(()=>{/* fail silently — never block login */});
  }catch(e){/* never block login on alert failure */}
}

// ─── THEME ────────────────────────────────────────────────────

// ═══════════════════════════════════════════════════════════════
// PWA INSTALL BUTTON
// ═══════════════════════════════════════════════════════════════
function PwaInstallButton(){
  const[deferredPrompt,setDeferredPrompt]=useState(null);
  useEffect(()=>{
    const onBefore=e=>{e.preventDefault();setDeferredPrompt(e);};
    const onInstalled=()=>setDeferredPrompt(null);
    window.addEventListener('beforeinstallprompt',onBefore);
    window.addEventListener('appinstalled',onInstalled);
    return()=>{
      window.removeEventListener('beforeinstallprompt',onBefore);
      window.removeEventListener('appinstalled',onInstalled);
    };
  },[]);
  if(!deferredPrompt)return null;
  const install=async()=>{
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted')setDeferredPrompt(null);
  };
  return React.createElement('button',{
    className:'btn btn-primary btn-sm',
    onClick:install,
    title:'Install Shittu Stores as a standalone app',
    style:{marginRight:4}
  },'\uD83D\uDCF2 Install App');
}

// ═══════════════════════════════════════════════════════════════
// BROWSER NOTIFICATION HELPERS
// ═══════════════════════════════════════════════════════════════
async function requestNotificationPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default'){
    await Notification.requestPermission();
  }
}

function showOrderNotification(order){
  const title='\uD83D\uDED2 New Order \u2014 Shittu Stores';
  const body=[
    order.customerName||'A customer',
    'ordered',
    order.product||'a product',
    order.bundleLabel?'('+order.bundleLabel+')':'',
  ].filter(Boolean).join(' ');

  const opts={
    body,
    icon:'./icon.svg',
    badge:'./icon.svg',
    tag:'order-'+Date.now(),
    requireInteraction:true,
    vibrate:[200,100,200],
    data:{url:window.location.href},
  };

  // Prefer service-worker notification (works in background tabs)
  if('serviceWorker' in navigator&&navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({
      type:'SHOW_NOTIFICATION',title,body:opts.body,
      tag:opts.tag,url:opts.data.url,
    });
    return;
  }
  // Fallback: direct Notification API (foreground only)
  if('Notification' in window&&Notification.permission==='granted'){
    try{
      const n=new Notification(title,opts);
      n.onclick=()=>{window.focus();n.close();};
      setTimeout(()=>n.close(),15000);
    }catch(e){}
  }
}

// ═══════════════════════════════════════════════════════════════
// EMAILJS ORDER NOTIFICATIONS
// Config stored in localStorage; no server required.
// ═══════════════════════════════════════════════════════════════
function getOrderNotifCfg(){
  try{return JSON.parse(localStorage.getItem('ssOrderNotifConfig')||'{}');}catch{return{};}
}
function saveOrderNotifCfg(cfg){
  localStorage.setItem('ssOrderNotifConfig',JSON.stringify(cfg||{}));
}

function sendOrderEmail(order){
  try{
    const cfg=getOrderNotifCfg();
    if(!cfg.enabled||!cfg.serviceId||!cfg.templateId||!cfg.publicKey)return;
    if(!cfg.recipientEmails)return;
    if(typeof emailjs==='undefined')return;
    const emails=cfg.recipientEmails.split(',').map(e=>e.trim()).filter(Boolean);
    if(!emails.length)return;
    const cc=(order.countryCode&&order.countryCode.trim())?order.countryCode.trim()+' ':'';
    const tplParams={
      customer_name:    order.customerName||'\u2014',
      customer_phone:   cc+(order.contact||'\u2014'),
      customer_phone2:  order.contact2?(cc+order.contact2):'',
      customer_address: order.address||'\u2014',
      product_name:     order.product||'\u2014',
      bundle_label:     order.bundleLabel||'\u2014',
      size:             order.size||'',
      selling_price:    order.sellingPrice
                          ?('GH\u20B5'+parseFloat(order.sellingPrice).toFixed(2))
                          :'\u2014',
      order_date:       order.date||new Date().toISOString().slice(0,10),
      notes:            order.notes||'',
      order_source:     order.source==='order_form'
                          ?'Customer Order Form':'Business Manager',
    };
    emails.forEach(to=>{
      emailjs.send(
        cfg.serviceId,cfg.templateId,
        {...tplParams,to_email:to},
        {publicKey:cfg.publicKey}
      ).catch(()=>{/* fail silently */});
    });
  }catch(e){/* never block the main flow */}
}

// ═══════════════════════════════════════════════════════════════
// ORDER NOTIFICATIONS SETTINGS TAB
// ═══════════════════════════════════════════════════════════════
function OrderNotificationsTab(){
  const[cfg,setCfg]=useState(()=>getOrderNotifCfg());
  const[perm,setPerm]=useState(
    ()=>'Notification' in window?Notification.permission:'unavailable'
  );
  const[testing,setTesting]=useState(false);
  const set=k=>e=>setCfg(p=>({...p,[k]:e.target.value}));

  const save=()=>{
    if(cfg.enabled){
      if(!cfg.serviceId||!cfg.templateId||!cfg.publicKey){
        toast('Fill in Service ID, Template ID and Public Key','error');return;
      }
      if(!cfg.recipientEmails){
        toast('Enter at least one recipient email','error');return;
      }
    }
    saveOrderNotifCfg(cfg);
    toast('Notification settings saved \u2713');
  };

  const reqPerm=async()=>{
    await requestNotificationPermission();
    setPerm(Notification.permission);
  };

  const testBrowserNotif=()=>{

// ─── SESSION TIMEOUT (auto re-login) ──────────────────────────
// For security, sessions are not permanent: after SESSION_TIMEOUT_MS of
// inactivity the user is automatically signed out and must log back in.
// A warning modal appears SESSION_WARN_MS before that happens, giving the
// user a chance to stay signed in.
const SESSION_TIMEOUT_MS = 30 * 60 * 1000;   // 30 minutes of inactivity
const SESSION_WARN_MS    =  5 * 60 * 1000;   // warn 5 min before expiry
const SESSION_CHECK_MS   = 20 * 1000;        // poll every 20 s

function useSessionTimeout(isLoggedIn, onLogout) {
  const lastActivityRef = useRef(Date.now());
  const [showWarning, setShowWarning] = useState(false);
  const [secondsLeft, setSecondsLeft] = useState(0);
  const checkTimerRef = useRef(null);

  const resetActivity = useCallback(() => {
    lastActivityRef.current = Date.now();
    setShowWarning(false);
  }, []);

  useEffect(() => {
    if (!isLoggedIn) { setShowWarning(false); return; }
    const events = ['mousemove','keydown','click','scroll','touchstart'];
    events.forEach(ev => window.addEventListener(ev, resetActivity, { passive: true }));
    resetActivity();
    checkTimerRef.current = setInterval(() => {
      const idle      = Date.now() - lastActivityRef.current;
      const remaining = Math.max(0, SESSION_TIMEOUT_MS - idle);
      if (remaining <= 0) { onLogout(); return; }
      if (remaining <= SESSION_WARN_MS) {
        setShowWarning(true);
        setSecondsLeft(Math.round(remaining / 1000));
      }
    }, SESSION_CHECK_MS);
    return () => {
      events.forEach(ev => window.removeEventListener(ev, resetActivity));
      if (checkTimerRef.current) clearInterval(checkTimerRef.current);
    };
  }, [isLoggedIn, onLogout, resetActivity]);

  return { showWarning, secondsLeft, stayIn: resetActivity };
}

// ─── DASHBOARD NORMALIZER ────────────────────────────────────
// Makes the frontend work with BOTH the old backend (v3.3) and the new
// v3.4 backend. If the new fields are missing it computes them from the
// legacy fields so dashboards never show "—" due to a backend version mismatch.
//
// v3.3 → v3.4 field mapping:
//   revenueGHC (old = net after COGS+delivery) → netRevenueGHC
//   grossRevenueGHC → not in v3.3, estimated via revenueGHC (safe fallback)
//   netProfitNGN (old = after all expenses) → netProfitAfterAllExpensesNGN
//   totalAdSpend (old) → adSpendNGN
//   netProfitAfterAdsNGN → computed from grossProfitNGN - adSpendNGN
function normalizeDash(raw) {
  if (!raw) return {};
  const d = { ...raw };

  // ── GHC revenue fields ──────────────────────────────────────
  // v3.3 sent revenueGHC = net (after COGS + delivery), v3.4 renamed it
  if (d.netRevenueGHC == null && d.revenueGHC != null) {
    d.netRevenueGHC = d.revenueGHC;
  }
  // grossRevenueGHC was added in v3.4. In v3.3 it wasn't returned separately,
  // so we fall back to netRevenueGHC (a slight undercount but better than "—").
  if (d.grossRevenueGHC == null) {
    d.grossRevenueGHC = d.netRevenueGHC || d.revenueGHC || 0;
  }
  if (d.totalCOGS_GHC == null)         d.totalCOGS_GHC = 0;
  if (d.totalDeliveryCost_GHC == null)  d.totalDeliveryCost_GHC = 0;
  // Recompute netRevenueGHC properly if we have all components
  if (d.totalCOGS_GHC > 0 || d.totalDeliveryCost_GHC > 0) {
    d.netRevenueGHC = sp(d.grossRevenueGHC) - sp(d.totalCOGS_GHC) - sp(d.totalDeliveryCost_GHC);
  }

  // ── NGN expense fields ──────────────────────────────────────
  // v3.3 used totalAdSpend; v3.4 renamed to adSpendNGN
  if (d.adSpendNGN == null && d.totalAdSpend != null) {
    d.adSpendNGN = d.totalAdSpend;
  }
  if (d.adSpendNGN == null) d.adSpendNGN = 0;
  if (d.totalExpensesNGN == null) {
    // In v3.3 we can't know the full total, best guess = ad spend
    d.totalExpensesNGN = d.adSpendNGN;
  }
  if (!d.expenseByCategory) d.expenseByCategory = {};

  // ── NGN profit fields ──────────────────────────────────────
  const rate = d.lastExRate != null ? sp(d.lastExRate) : null;
  if (d.grossProfitNGN == null) {
    d.grossProfitNGN = rate != null ? sp(d.netRevenueGHC) * rate : null;
  }
  if (d.netProfitAfterAdsNGN == null) {
    d.netProfitAfterAdsNGN = d.grossProfitNGN != null
      ? sp(d.grossProfitNGN) - sp(d.adSpendNGN) : null;
  }
  if (d.netProfitAfterAllExpensesNGN == null) {
    // v3.3 returned netProfitNGN = after all expenses
    if (d.netProfitNGN != null) {
      d.netProfitAfterAllExpensesNGN = d.netProfitNGN;
    } else if (d.grossProfitNGN != null) {
      d.netProfitAfterAllExpensesNGN = sp(d.grossProfitNGN) - sp(d.totalExpensesNGN);
    } else {
      d.netProfitAfterAllExpensesNGN = null;
    }
  }

  return d;
}

function isActive(x){return x===true||x==='TRUE'||x==='true';}
function statusOf(o){return o?.deliveryStatus||o?.status||'Not Confirmed';}
function paymentOf(o){return o?.paymentStatus||'Unpaid';}

function readList(v){if(Array.isArray(v))return v;if(!v)return[];try{const p=JSON.parse(v);return Array.isArray(p)?p:[];}catch{}return String(v).split(',').map(x=>x.trim()).filter(Boolean);}
function supplierOwnsOrder(order,products,user){
  if(!user||user.role!=='supplier')return true;
  const product=products.find(p=>p.name===order.product);
  const assigned=readList(user.assignedProducts||user.products||user.productNames);
  const productSuppliers=readList(product?.supplierUsernames||product?.suppliers);
  return order.supplierUsername===user.username||order.supplier===user.username||product?.supplierUsername===user.username||productSuppliers.includes(user.username)||assigned.includes(order.product);
}

// ─── DATA HOOK ────────────────────────────────────────────────
function useData(action,enabled=true){
  const[data,setData]=useState(()=>{if(!enabled||!API.url)return null;const c=cacheGet(JSON.stringify({action}));return c?c.v:null;});
  const[loading,setLoading]=useState(()=>{if(!enabled||!API.url)return false;return!cacheGet(JSON.stringify({action}));});
  const[error,setError]=useState('');
  const load=useCallback(async(force=false)=>{
    if(!enabled){setLoading(false);return;}if(!API.url){setLoading(false);return;}
    const c=cacheGet(JSON.stringify({action}));if(c&&!force){setData(c.v);setLoading(false);return;}
    setLoading(true);setError('');const r=await API.call({action});setLoading(false);
    if(r.success)setData(r.data||[]);else setError(r.error||'Failed');
  },[action,enabled]);
  useEffect(()=>{load();},[load]);
  return{data,loading,error,reload:()=>load(true),setData};
}

    data.map((d,i)=>{

        React.createElement('text',{x:x+bw/2,y:height-1,textAnchor:'middle',fontSize:5,fill:'var(--text3)'},d.label));
    })

}
function LineChart({data,color='var(--accent)',height=80}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data.map(d=>d.value),1);
  const pts=data.map((d,i)=>{const x=i*(100/(data.length-1));const y=height-12-(d.value/max)*(height-20);return[x,y];});
  const path='M'+pts.map(p=>p.join(',')).join(' L');

  return React.createElement('svg',{viewBox:`0 0 100 ${height}`,className:'chart-svg',style:{height}},

    React.createElement('path',{d:areaPath,fill:'url(#lg)'}),
    React.createElement('path',{d:path,fill:'none',stroke:color,strokeWidth:1.5,strokeLinejoin:'round'}),
    pts.map((p,i)=>React.createElement('circle',{key:i,cx:p[0],cy:p[1],r:1.5,fill:color})),
    data.map((d,i)=>React.createElement('text',{key:i,x:pts[i][0],y:height-1,textAnchor:'middle',fontSize:5,fill:'var(--text3)'},d.label))

  const load=useCallback(async()=>{
    setLoading(true);
    const params={action:'getOrders'};
    if(isSupplier)params.supplierUsername=user.username;
    const[or,pr,sf]=await Promise.all([API.call(params),API.call({action:'getProducts'}),API.call({action:'getStaff'})]);
    if(or.success)setOrders(or.data||[]);

  useEffect(()=>{load();},[load]);

  const filtered=useMemo(()=>{

    if(statusFilter)r=r.filter(o=>statusOf(o)===statusFilter);
    if(contactFilter)r=r.filter(o=>(o.contactStatus||'Uncontacted')===contactFilter);
    if(payFilter)r=r.filter(o=>o.paymentStatus===payFilter);
    if(readinessFilter)r=r.filter(o=>readinessOf(o)===readinessFilter);

    return r;
  },[orders,statusFilter,contactFilter,payFilter,readinessFilter,search,products,user]);

  // Daily reschedule tally — grouped by the date the customer rescheduled to.
  const rescheduleTally=useMemo(()=>{
    const m={};
    filtered.forEach(o=>{
      if(readinessOf(o)==='Rescheduled'&&o.rescheduledTo){
        const dk=(o.rescheduledTo||'').split(' ')[0];
        if(dk)m[dk]=(m[dk]||0)+1;
      }
    });
    return Object.entries(m).sort((a,b)=>a[0]<b[0]?-1:1);
  },[filtered]);

  const updateField=useCallback(async(order,updates)=>{
    const updated={...order,...updates};
    setOrders(prev=>prev.map(o=>o.id===order.id?updated:o));
    const r=await API.call({action:'updateOrder',id:order.id,order:JSON.stringify(updated)});
    if(!r.success){setOrders(prev=>prev.map(o=>o.id===order.id?order:o));toast(r.error||'Update failed','error');}
  },[]);

  const del=async o=>{
    if(!confirm(`Delete order for ${o.customerName}?`))return;
    setOrders(prev=>prev.filter(x=>x.id!==o.id));
    const r=await API.call({action:'deleteOrder',id:o.id});
    if(r.success)toast('Order deleted');else{setOrders(prev=>[...prev,o]);toast(r.error||'Delete failed','error');}
  };

  const markContacted=useCallback(async(order,byUsername)=>{
    await updateField(order,{contactStatus:'Contacted',contactedBy:byUsername});
    toast('Marked as contacted ✓');
  },[updateField]);

  // Set readiness status. "Rescheduled" opens a date popup; "Cancelled" also
  // flips the delivery status to Canceled so analytics stay consistent.
  const setReadiness=useCallback(async(order,status)=>{
    if(status==='Rescheduled'){setReschedulingOrder(order);return;}
    const updates={readinessStatus:status,rescheduledTo:''};
    if(status==='Cancelled')updates.deliveryStatus='Canceled';
    await updateField(order,updates);
    toast(`Readiness set: ${status} ✓`);
  },[updateField]);

  const confirmReschedule=useCallback(async(order,dateStr)=>{
    await updateField(order,{readinessStatus:'Rescheduled',rescheduledTo:dateStr,deliveryStatus:'Rescheduled'});
    setReschedulingOrder(null);
    toast(`Rescheduled to ${dateStr} ✓`);
  },[updateField]);

      React.createElement('input',{className:'search-input',placeholder:'Search name, phone, product...',value:search,onChange:e=>setSearch(e.target.value)}),

        React.createElement('option',{value:''},'All Contact'),
        CONTACT_STATUSES.map(s=>React.createElement('option',{key:s,value:s},s))),
      React.createElement('select',{className:'form-select',style:{width:160},value:readinessFilter,onChange:e=>setReadinessFilter(e.target.value)},
        React.createElement('option',{value:''},'All Readiness'),
        READINESS_STATUSES.map(s=>React.createElement('option',{key:s,value:s},s))),
      React.createElement('select',{className:'form-select',style:{width:120},value:payFilter,onChange:e=>setPayFilter(e.target.value)},
        React.createElement('option',{value:''},'All Payment'),
        PAYMENT_OPTIONS.map(s=>React.createElement('option',{key:s,value:s},s))),
      React.createElement('button',{className:'btn btn-secondary',onClick:()=>load()},'↻')
    ),
    loading&&orders.length===0
      ?React.createElement('div',{className:'loading-full'},React.createElement('div',{className:'spinner'}),React.createElement('div',{className:'loading-label'},'Loading orders...'))
      :filtered.length===0
        ?React.createElement('div',{className:'empty-state'},React.createElement('div',{className:'empty-icon'},'📦'),React.createElement('div',{className:'empty-text'},'No orders match your filters'))
        :React.createElement('div',{className:'table-wrap'},React.createElement('table',null,
          React.createElement('thead',null,React.createElement('tr',null,
            ['Date','Customer','Product','Contact','Readiness','Delivery','Payment','Del. Price','Source','Actions'].map(h=>React.createElement('th',{key:h},h)))),
          React.createElement('tbody',null,filtered.map(o=>{
            const cs=o.contactStatus||'Uncontacted';
            const ds=statusOf(o);
            const rs=readinessOf(o);
            const isDelivered=ds==='Delivered';
            const isContacted=cs==='Contacted';
            return React.createElement('tr',{key:o.id},
              React.createElement('td',null,
                React.createElement('div',null,o.date||'—'),
                isDelivered&&o.deliveryDate&&React.createElement('div',{style:{fontSize:10,color:'var(--text3)'}},`Delivered: ${o.deliveryDate}`)),
              React.createElement('td',null,
                React.createElement('div',{style:{fontWeight:600}},o.customerName),
                React.createElement('div',{style:{fontSize:11,color:'var(--text3)'}},o.contact),
                o.contact2&&React.createElement('div',{style:{fontSize:11,color:'var(--text3)'}},o.contact2),
                o.address&&React.createElement('div',{style:{fontSize:10,color:'var(--text3)',maxWidth:110,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},o.address),
                React.createElement('div',{className:'copy-btn-row'},React.createElement(CopyDetailsBtn,{order:o,products}))
              ),
              React.createElement('td',null,
                React.createElement('div',{style:{fontWeight:600}},o.product),
                o.bundleLabel&&React.createElement('div',{style:{fontSize:11,color:'var(--accent)'}},o.bundleLabel),
                o.size&&React.createElement('div',{style:{fontSize:11,color:'var(--text3)'}},`Size: ${o.size}`),

              React.createElement('td',null,
                contactBadge(cs),

              // Readiness column — set after the order is contacted

              React.createElement('td',null,
                o.deliveryPrice?React.createElement('div',{className:'td-mono'},fmtGHC(o.deliveryPrice)):React.createElement('div',{style:{color:'var(--text3)',fontSize:12}},'—'),

      onClose:()=>setReschedulingOrder(null)
    })
  );
}

function OrderModal({order,products,user,isAdmin,onSave,onSaving,onClose}){
  const isEdit=!!order;
  const[f,setF]=useState(()=>order?{...order}:{
    date:today(),deliveryDate:'',customerName:'',address:'',contact:'',contact2:'',
    product:'',bundleLabel:'',qty:'',size:'',sellingPrice:'',costOfProduct:'',
    deliveryPrice:'',paymentStatus:'Unpaid',notes:'',deliveryStatus:'Not Confirmed',
    contactStatus:'Uncontacted',contactedBy:'',readinessStatus:'',rescheduledTo:'',
    createdBy:user.username,supplierUsername:'',isCustom:false
  });
  const[saving,setSaving]=useState(false);
  const[showContact2,setShowContact2]=useState(!!(order&&order.contact2));
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const prod=useMemo(()=>products.find(p=>p.name===f.product),[f.product,products]);
  const bundles=useMemo(()=>{try{return JSON.parse(prod?.bundles||'[]');}catch{return[];}},[prod]);
  const sizes=useMemo(()=>{if(!prod||(prod.hasSizes!==true&&prod.hasSizes!=='true'))return[];try{return JSON.parse(prod?.sizes||'[]');}catch{return[];}},[prod]);
  const prevProduct=useRef(f.product);
  useEffect(()=>{
    if(isEdit)return;
    if(f.product===prevProduct.current)return;
    prevProduct.current=f.product;
    if(prod){
      const su=readList(prod.supplierUsernames||prod.supplierUsername);
      setF(p=>({...p,bundleLabel:'',qty:'',sellingPrice:'',costOfProduct:'',isCustom:false,supplierUsername:su[0]||prod.supplierUsername||''}));
    }
  },[f.product,prod,isEdit]);

  const isCustom=f.bundleLabel==='__custom__'||f.isCustom;
  const selectedBundle=useMemo(()=>{
    if(isCustom||!f.bundleLabel)return null;
    return bundles.find(b=>b.label===f.bundleLabel)||null;
  },[bundles,f.bundleLabel,isCustom]);

  const pickBundle=sel=>{
    if(sel==='__custom__'){setF(p=>({...p,bundleLabel:'__custom__',isCustom:true,qty:'',sellingPrice:'',costOfProduct:'',deliveryPrice:'',paymentStatus:'Unpaid'}));return;}
    const b=bundles.find(x=>x.label===sel);if(!b)return;
    const su=readList(prod?.supplierUsernames||prod?.supplierUsername);
    setF(p=>({...p,bundleLabel:b.label,qty:b.qty,sellingPrice:b.sellingPrice||b.price||'',costOfProduct:b.costPrice||b.cost||'',isCustom:false,supplierUsername:su[0]||p.supplierUsername||''}));
  };

  const validate=()=>{
    if(!f.customerName){toast('Customer name required','error');return false;}
    if(!f.contact){toast('Contact phone required','error');return false;}
    if(!f.address){toast('Delivery address required','error');return false;}
    if(!f.product){toast('Please select a product','error');return false;}
    if(bundles.length>0&&!f.bundleLabel){toast('Please select a bundle/package','error');return false;}
    if(sizes.length>0&&!f.size){toast('Please select a size','error');return false;}
    if(isCustom&&!f.qty){toast('Qty required for custom orders','error');return false;}
    return true;
  };

  const save=async()=>{
    if(!validate())return;setSaving(true);if(onSaving)onSaving(true);
    const payload={...f,bundleLabel:isCustom?`Custom x${f.qty}`:f.bundleLabel,source:f.source||'manager'};
    const r=isEdit
      ?await API.call({action:'updateOrder',id:order.id,order:JSON.stringify(payload)})
      :await API.call({action:'addOrder',order:JSON.stringify(payload)});
    setSaving(false);if(onSaving)onSaving(false);
    if(r.success){const saved=isEdit?payload:{...payload,id:r.data?.id||('tmp_'+Date.now())};onSave(saved);if(!isEdit){showOrderNotification(saved);sendOrderEmail(saved);}}
    else toast(r.error||'Save failed','error');

  return React.createElement('div',{className:'modal-overlay',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    React.createElement('div',{className:'modal modal-lg'},
      React.createElement('div',{className:'modal-header'},
        React.createElement('div',{className:'modal-title'},isEdit?'Edit Order':'New Order'),
        React.createElement('button',{className:'close-btn',onClick:onClose,disabled:saving},'×')),
      React.createElement('div',{className:'modal-body'},
        React.createElement('div',{className:'section-divider'},'Customer Details'),
        React.createElement('div',{className:'form-group',style:{marginBottom:12}},
          React.createElement('label',{className:'form-label'},'Order Date *'),
          React.createElement('input',{className:'form-input',type:'date',value:f.date||'',onChange:set('date')})),
        React.createElement('div',{className:'form-grid form-grid-2',style:{marginBottom:14}},

          React.createElement('div',{className:'form-group'},

function StaffAnalyticsPage({user}){
  const[orders,setOrders]=useState([]);
  const[payoutRecords,setPayoutRecords]=useState([]);
  const[loading,setLoading]=useState(true);
  const[period,setPeriod]=useState('all');
  const[selMonth,setSelMonth]=useState(()=>today().slice(0,7));
  const[selYear,setSelYear]=useState(()=>today().slice(0,4));

  useEffect(()=>{
    setLoading(true);
    Promise.all([API.call({action:'getOrders'}),API.call({action:'getPayoutRecords'})]).then(([or,pr])=>{
      if(or.success)setOrders(or.data||[]);
      if(pr.success)setPayoutRecords(pr.data||[]);
      setLoading(false);
    });
  },[]);

  const username=user.username;
  const myOrders=useMemo(()=>orders.filter(o=>o.contactedBy===username),[orders,username]);
  const years=useMemo(()=>{
    const s=new Set(myOrders.map(o=>String(o.date||'').slice(0,4)).filter(Boolean));
    return[...s].sort().reverse();
  },[myOrders]);

  const filtered=useMemo(()=>{
    if(period==='month')return myOrders.filter(o=>String(o.date||'').startsWith(selMonth));
    if(period==='year')return myOrders.filter(o=>String(o.date||'').startsWith(selYear));
    return myOrders;
  },[myOrders,period,selMonth,selYear]);

  const delivered=filtered.filter(o=>statusOf(o)==='Delivered');
  const deliveredPaid=delivered.filter(o=>paymentOf(o)==='Paid');
  const pending=filtered.filter(o=>!['Delivered','Canceled'].includes(statusOf(o)));
  const canceled=filtered.filter(o=>statusOf(o)==='Canceled');
  const revenueGHC=deliveredPaid.reduce((s,o)=>s+sp(o.sellingPrice),0);
  const earnings=deliveredPaid.length*STAFF_PAYOUT_NGN;
  const paidOut=payoutRecords.filter(r=>r.staffName===username).reduce((s,r)=>s+sp(r.amountNGN),0);
  const allDeliveredPaidAllTime=myOrders.filter(o=>statusOf(o)==='Delivered'&&paymentOf(o)==='Paid');
  const totalEarnedAllTime=allDeliveredPaidAllTime.length*STAFF_PAYOUT_NGN;
  const unpaidBalance=Math.max(0,totalEarnedAllTime-paidOut);
  const allTimeConv=myOrders.length>0?Math.round(allDeliveredPaidAllTime.length/myOrders.length*100):0;
  const filteredConv=filtered.length>0?Math.round(deliveredPaid.length/filtered.length*100):0;
  const byStatus=useMemo(()=>{const m={};DELIVERY_STATUSES.forEach(s=>{m[s]=filtered.filter(o=>statusOf(o)===s).length;});return m;},[filtered]);

    React.createElement('div',{className:'section-header'},
      React.createElement('div',null,
        React.createElement('div',{className:'section-title'},'My Analytics'),
        React.createElement('div',{className:'section-sub'},`Performance for ${user.name||user.username} (${username})`))),
    React.createElement('div',{className:'cc-info-box'},
      React.createElement('div',{className:'cc-info-title'},'ℹ️ How this is calculated'),
      React.createElement('div',{className:'cc-info-text'},`These stats count orders where "Contacted By" is set to your username: "${username}". Earnings are ₦2,000 per order that is both Delivered and Paid.`)),

    React.createElement('div',{className:'card',style:{marginBottom:20}},
      React.createElement('div',{style:{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}},
        React.createElement('div',{className:'tabs',style:{margin:0}},
          [{id:'all',label:'All Time'},{id:'year',label:'By Year'},{id:'month',label:'By Month'}].map(t=>
            React.createElement('div',{key:t.id,className:`tab ${period===t.id?'active':''}`,onClick:()=>setPeriod(t.id)},t.label))),
        period==='month'&&React.createElement('input',{type:'month',className:'form-input',style:{width:160},value:selMonth,onChange:e=>setSelMonth(e.target.value)}),
        period==='year'&&React.createElement('select',{className:'form-select',style:{width:120},value:selYear,onChange:e=>setSelYear(e.target.value)},
          years.map(y=>React.createElement('option',{key:y,value:y},y))))),
    React.createElement('div',{className:'stat-grid'},[

// ─── PROFIT ANALYSIS TOOL ──────────────────────────────────────
// Lets the admin toggle individual expense categories on/off and instantly
// see the resulting "Net Profit" — answering questions like "what would my
// profit be after ads only?" or "after ads + salary, before logistics?".
//
//   Gross Profit (NGN)        = Revenue (GHC) × exchange rate  (no expenses)
//   Net Profit (selected)     = Gross Profit − sum(selected category amounts)
//   Net Profit (after ALL)    = Gross Profit − totalExpensesNGN
function ProfitAnalysisCard({dash,loading,reload}){
  const d=dash||{};
  const catAmounts=d.expenseByCategory||{};
  const allCats=useMemo(()=>{
    const fromData=Object.keys(catAmounts);
    const merged=[...EXPENSE_CATEGORIES];
    fromData.forEach(c=>{if(!merged.includes(c))merged.push(c);});
    return merged.filter(c=>sp(catAmounts[c])>0||EXPENSE_CATEGORIES.includes(c));
  },[catAmounts]);

  // Default selection = "after all expenses" (matches the Dashboard's
  // featured Net Profit figure).
  const [selected, setSelected] = useState(()=>new Set(allCats));
  useEffect(()=>{ setSelected(new Set(allCats)); }, [allCats.join(',')]); // eslint-disable-line

  const toggle=(cat)=>setSelected(prev=>{
    const next=new Set(prev);
    if(next.has(cat))next.delete(cat);else next.add(cat);
    return next;
  });

  const grossProfit=sp(d.grossProfitNGN);
  const selectedTotal=allCats.reduce((s,c)=>selected.has(c)?s+sp(catAmounts[c]||0):s,0);
  const resultProfit=grossProfit-selectedTotal;
  const allSelected=selected.size===allCats.length;
  const noneSelected=selected.size===0;

  const applyPreset=(preset)=>{
    if(preset==='none')setSelected(new Set());
    else if(preset==='all')setSelected(new Set(allCats));
    else if(preset==='ads')setSelected(new Set(allCats.filter(c=>c==='Ad Cost')));
    else if(preset==='ads-salary')setSelected(new Set(allCats.filter(c=>c==='Ad Cost'||c==='Salary')));
  };

  let resultLabel='Net Profit';
  if(noneSelected)resultLabel='Gross Profit (no expenses deducted)';
  else if(allSelected)resultLabel='Net Profit (after ALL expenses)';
  else resultLabel=`Net Profit (after ${[...selected].join(', ')})`;

  return React.createElement('div',{className:'card',style:{marginBottom:24}},
    React.createElement('div',{className:'section-header',style:{marginBottom:14}},
      React.createElement('div',null,
        React.createElement('div',{className:'section-title'},'🔍 Profit Analysis'),
        React.createElement('div',{className:'section-sub'},'Toggle expense categories to see net profit under different scenarios')),
      React.createElement('button',{className:'btn btn-secondary btn-sm',onClick:reload},'↻ Refresh')),
    loading&&!dash
      ?React.createElement('div',{className:'loading-full'},React.createElement('div',{className:'spinner'}))
      :d.lastExRate==null
        ?React.createElement('div',{className:'alert-warning'},'⚠️ No exchange rate recorded yet. Record a withdrawal under Financials to enable NGN profit analysis.')
        :React.createElement('div',null,
          React.createElement('div',{className:'alert-info'},
            `💡 Gross Profit (before any expense) = Revenue (GHC) ${fmtGHC(d.netRevenueGHC)} × ₦${d.lastExRate}/GH₵ = ${fmtNGN(grossProfit)}. Select which expense categories to subtract below.`),
          React.createElement('div',{className:'profit-preset-row'},
            React.createElement('button',{className:'btn btn-secondary btn-sm',onClick:()=>applyPreset('none')},'Before Expenses (Gross)'),
            React.createElement('button',{className:'btn btn-secondary btn-sm',onClick:()=>applyPreset('ads')},'After Ads Only'),
            React.createElement('button',{className:'btn btn-secondary btn-sm',onClick:()=>applyPreset('ads-salary')},'After Ads + Salary'),
            React.createElement('button',{className:'btn btn-secondary btn-sm',onClick:()=>applyPreset('all')},'After ALL Expenses')),
          React.createElement('div',{className:'profit-filter-grid'},
            allCats.length===0
              ?React.createElement('div',{className:'text-muted'},'No expenses recorded yet — add some under the Expenses page.')
              :allCats.map(cat=>
                React.createElement('label',{key:cat,className:`profit-filter-chip ${selected.has(cat)?'active':''}`},
                  React.createElement('input',{type:'checkbox',checked:selected.has(cat),onChange:()=>toggle(cat)}),
                  React.createElement('span',null,cat),
                  React.createElement('span',{style:{fontFamily:'var(--font-mono)',color:'var(--text3)'}},`(${fmtNGN(catAmounts[cat]||0)})`)
                )
              )
          ),
          React.createElement('div',{className:'profit-result-card'},
            React.createElement('div',{className:'profit-result-label'},resultLabel),
            React.createElement('div',{className:'profit-result-value',style:{color:resultProfit>=0?'var(--green)':'var(--red)'}},fmtNGN(resultProfit)),
            React.createElement('div',{className:'profit-result-sub'},
              `${fmtNGN(grossProfit)} (gross profit) − ${fmtNGN(selectedTotal)} (selected expenses) = ${fmtNGN(resultProfit)}`,
              React.createElement('br'),
              allSelected&&`This matches the "Net Profit" figure on your Dashboard.`
            )
          )
        )
  );
}

    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'section-title',style:{fontSize:14,marginBottom:12}},'✅ Other security notes'),
      React.createElement('div',{className:'cc-info-text'},
        '• Each staff/supplier account has its own username and password — never share logins.',React.createElement('br'),
        '• Change your password periodically under the Password tab.',React.createElement('br'),
        '• Optional login-alert emails can be configured under the Login Alerts tab so you know whenever someone signs in.'))
  );
}

// ─── ERROR BOUNDARY ───────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){console.error('App error:',error,info);}
  render(){
    if(this.state.hasError){
      return React.createElement('div',{style:{padding:40,textAlign:'center',fontFamily:'sans-serif',color:'#e8eaf0',background:'#0a0c10',minHeight:'100vh'}},
        React.createElement('div',{style:{fontSize:40,marginBottom:16}},'⚠️'),
        React.createElement('div',{style:{fontSize:18,fontWeight:700,marginBottom:8}},'Something went wrong'),
        React.createElement('div',{style:{fontSize:13,color:'#9aa0b4',marginBottom:20,maxWidth:420,margin:'0 auto 20px'}},String(this.state.error?.message||this.state.error||'Unknown error')),
        React.createElement('button',{onClick:()=>window.location.reload(),style:{padding:'10px 20px',background:'#f5a623',color:'#000',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer'}},'Reload App'));
    }
    return this.props.children;
  }
}

// ─── BOOTSTRAP ────────────────────────────────────────────────
(function bootstrap(){
  try{
    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ErrorBoundary,null,React.createElement(App)));
  }catch(e){
    document.getElementById('root').innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif;color:#e74c3c">Failed to start: '+(e&&e.message||e)+'</div>';
  }
})();
</script>
