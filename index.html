<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--bg4:#222838;
  --border:#2a3040;--border2:#38435a;
  --accent:#f5a623;--accent2:#e8912a;--accent-dim:rgba(245,166,35,0.12);
  --green:#2ecc71;--green-dim:rgba(46,204,113,0.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,0.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,0.12);
  --purple:#9b59b6;
  --text:#e8eaf0;--text2:#9aa0b4;--text3:#5a6070;
  --font-head:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:16px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --transition:0.2s ease;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5}
#root{height:100%}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--transition)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

/* ── SIDEBAR ── */
.sidebar-logo{padding:20px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-text{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.nav-section{padding:8px 8px 0;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(245,166,35,0.2)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);background:var(--bg3)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text)}
.user-role{font-size:10px;color:var(--text3)}

/* ── TOPBAR ── */
.topbar-title{font-family:var(--font-head);font-size:15px;font-weight:700;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:var(--font-body)}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.2)}
.btn-danger:hover{background:rgba(231,76,60,0.2)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(46,204,113,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;border-radius:var(--radius)}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.card-sm{padding:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:50%;opacity:0.06;transform:translate(20px,-20px)}
.stat-card.orange::before{background:var(--accent)}
.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}
.stat-card.blue::before{background:var(--blue)}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.stat-value{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.td-mono{font-family:var(--font-mono);font-size:12px}

/* ── STATUS BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-delivered{background:var(--green-dim);color:var(--green)}
.badge-canceled{background:var(--red-dim);color:var(--red)}
.badge-rescheduled{background:rgba(52,152,219,0.12);color:var(--blue)}
.badge-notconfirmed{background:rgba(155,89,182,0.12);color:var(--purple)}
.badge-noresponse{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-processing{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-paid{background:var(--green-dim);color:var(--green)}
.badge-unpaid{background:var(--red-dim);color:var(--red)}

/* ── FORM ── */
.form-grid{display:grid;gap:14px}
.form-grid-2{grid-template-columns:1fr 1fr}
.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color var(--transition)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-select option{background:var(--bg3)}
.form-textarea{resize:vertical;min-height:70px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-family:var(--font-head);font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)}
.close-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;border-radius:6px;line-height:1}
.close-btn:hover{color:var(--text);background:var(--bg3)}

/* ── FILTERS BAR ── */
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;width:220px}
.search-input:focus{border-color:var(--accent)}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-logo{font-family:var(--font-head);font-size:28px;font-weight:800;color:var(--accent);margin-bottom:6px}
.login-sub{color:var(--text3);font-size:13px;margin-bottom:32px}
.login-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.25);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px}

/* ── SETUP ALERT ── */
.setup-banner{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.25);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.setup-banner-icon{font-size:20px;margin-top:2px}
.setup-banner-title{font-weight:700;color:var(--accent);margin-bottom:4px}
.setup-banner-text{color:var(--text2);font-size:13px;line-height:1.6}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--radius);width:fit-content;margin-bottom:20px}
.tab{padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,0.3)}

/* ── SETTINGS ── */
.settings-url{font-family:var(--font-mono);font-size:12px;word-break:break-all;color:var(--accent)}
.permission-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.perm-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.perm-chip.active{background:var(--accent-dim);border-color:rgba(245,166,35,0.3);color:var(--accent)}

/* ── MOBILE ── */
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .hamburger{display:block}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px}
  .filters-bar{flex-direction:column;align-items:stretch}
  .search-input{width:100%}
}

/* ── LOADING ── */
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text3)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:10px}
.empty-icon{font-size:40px;opacity:0.3}
.empty-text{font-size:14px}

/* ── PROFIT CHIP ── */
.profit-positive{color:var(--green);font-family:var(--font-mono);font-size:12px}
.profit-negative{color:var(--red);font-family:var(--font-mono);font-size:12px}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-title{font-family:var(--font-head);font-size:17px;font-weight:700}
.section-sub{font-size:12px;color:var(--text3);margin-top:2px}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:var(--shadow);animation:slideIn 0.25s ease;min-width:220px}
.toast.success{border-color:rgba(46,204,113,0.3);color:var(--green)}
.toast.error{border-color:rgba(231,76,60,0.3);color:var(--red)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--text3);font-size:12px}
.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.gap-3{gap:12px}.justify-between{justify-content:space-between}.flex-1{flex:1}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mb-2{margin-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,useMemo} = React;

// ═══════════════════════════════════════════════════════
// API LAYER
// ═══════════════════════════════════════════════════════
const API = {
  url: localStorage.getItem('apiUrl') || 'https://script.google.com/macros/s/AKfycbwxdGslHWScLe-l3lNt1SJLx_AbveynGvu-y7RwGkUemxhc_zRGBU7kPo5ZpDe6b1C8/exec',
  setUrl(u){ this.url = u; localStorage.setItem('apiUrl', u); },
  async call(params){
    if(!this.url) return {success:false,error:'No API URL set. Go to Settings to configure.'};
    try{
      const r = await fetch(this.url, {
        method:'POST', redirect:'follow',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(params)
      });
      return await r.json();
    } catch(e){
      return {success:false, error:e.message};
    }
  }
};

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
let toastFn = null;
function useToast(){
  const [toasts,setToasts] = useState([]);
  useEffect(()=>{
    toastFn = (msg,type='success')=>{
      const id = Date.now();
      setToasts(t=>[...t,{id,msg,type}]);
      setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
    };
  },[]);
  return toasts;
}
const toast = (msg,type)=>toastFn&&toastFn(msg,type);

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
const STATUS_OPTIONS = ['Not Confirmed','Processing','Resheduled','Delivered','Canceled','No Response'];
const PAYMENT_OPTIONS = ['Paid','Unpaid',''];
const EXPENSE_CATS = ['Ad Cost','Withdrawal','Logistics','Other'];

function statusBadge(s){
  const map = {'Delivered':'badge-delivered','Canceled':'badge-canceled','Resheduled':'badge-rescheduled','Not Confirmed':'badge-notconfirmed','No Response':'badge-noresponse','Processing':'badge-processing'};
  return React.createElement('span',{className:`badge ${map[s]||'badge-noresponse'}`},s||'—');
}
function payBadge(s){
  return React.createElement('span',{className:`badge ${s==='Paid'?'badge-paid':'badge-unpaid'}`},s||'—');
}
function fmt(n,dec=2){return n!=null&&n!==''?parseFloat(n).toFixed(dec):'—'}
function fmtGHC(n){return `GH₵ ${fmt(n,2)}`}
function fmtNGN(n){return `₦ ${fmt(n,0)}`}
function today(){return new Date().toISOString().split('T')[0]}
const PERMS_LIST = ['view_orders','add_orders','edit_orders','delete_orders','view_financials','view_dashboard','manage_expenses'];

// ═══════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════
function App(){
  const toasts = useToast();
  const [sidebarOpen,setSidebarOpen] = useState(false);
  const [page,setPage] = useState('dashboard');
  const [user,setUser] = useState(()=>{try{const u=localStorage.getItem('ssUser');return u?JSON.parse(u):null;}catch(e){return null;}});

  const login = useCallback(u=>{
    setUser(u);
    localStorage.setItem('ssUser',JSON.stringify(u));
  },[]);
  const logout = useCallback(()=>{
    setUser(null);
    localStorage.removeItem('ssUser');
    setPage('dashboard');
  },[]);
  const nav = useCallback(p=>{setPage(p);setSidebarOpen(false)},[]);

  if(!user) return React.createElement(LoginPage,{onLogin:login});

  const isAdmin = user.role==='admin';
  const perms = user.permissions==='all'?PERMS_LIST:(user.permissions||'').split(',').map(s=>s.trim());
  const can = p=>isAdmin||perms.includes(p);

  const navItems = [
    {id:'dashboard',icon:'📊',label:'Dashboard',show:can('view_dashboard')},
    {id:'orders',icon:'📦',label:'Orders',show:can('view_orders')},
    {id:'financials',icon:'💰',label:'Financials',show:can('view_financials')},
    {id:'expenses',icon:'📉',label:'Expenses',show:can('manage_expenses')},
    {id:'products',icon:'🏷️',label:'Products',show:isAdmin},
    {id:'staff',icon:'👥',label:'Staff',show:isAdmin},
    {id:'settings',icon:'⚙️',label:'Settings',show:isAdmin},
  ].filter(x=>x.show);

  const pageMap = {
    dashboard:React.createElement(DashboardPage,{user,can}),
    orders:React.createElement(OrdersPage,{user,can}),
    financials:React.createElement(FinancialsPage,{user,can}),
    expenses:React.createElement(ExpensesPage,{user,can}),
    products:React.createElement(ProductsPage,{user}),
    staff:React.createElement(StaffPage,{user}),
    settings:React.createElement(SettingsPage,{user}),
  };

  return React.createElement('div',{className:'app'},
    React.createElement('div',{className:`sidebar-overlay ${sidebarOpen?'show':''}`,onClick:()=>setSidebarOpen(false)}),
    React.createElement('aside',{className:`sidebar ${sidebarOpen?'open':''}`},
      React.createElement('div',{className:'sidebar-logo'},
        React.createElement('div',{className:'logo-text'},'Shittu Stores'),
        React.createElement('div',{className:'logo-sub'},'Business Manager')
      ),
      React.createElement('div',{className:'nav-section'},
        React.createElement('div',{className:'nav-section-label'},'Menu'),
        navItems.map(n=>
          React.createElement('div',{key:n.id,className:`nav-item ${page===n.id?'active':''}`,onClick:()=>nav(n.id)},
            React.createElement('span',{className:'nav-icon'},n.icon),
            n.label
          )
        )
      ),
      React.createElement('div',{className:'sidebar-footer'},
        React.createElement('div',{className:'user-pill'},
          React.createElement('div',{className:'user-avatar'},(user.name||user.username||'?')[0].toUpperCase()),
          React.createElement('div',null,
            React.createElement('div',{className:'user-name'},user.name||user.username),
            React.createElement('div',{className:'user-role'},user.role)
          )
        ),
        React.createElement('button',{className:'btn btn-secondary btn-sm',style:{width:'100%',marginTop:8},onClick:logout},'Sign Out')
      )
    ),
    React.createElement('div',{className:'main'},
      React.createElement('div',{className:'topbar'},
        React.createElement('button',{className:'hamburger',onClick:()=>setSidebarOpen(o=>!o)},'☰'),
        React.createElement('div',{className:'topbar-title'},navItems.find(n=>n.id===page)?.label||''),
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
          !API.url&&React.createElement('span',{style:{fontSize:11,color:'var(--accent)',background:'var(--accent-dim)',padding:'3px 8px',borderRadius:20}},'⚠ Setup Required')
        )
      ),
      React.createElement('div',{className:'content'},
        pageMap[page]||pageMap.dashboard
      )
    ),
    React.createElement('div',{className:'toast-wrap'},
      toasts.map(t=>React.createElement('div',{key:t.id,className:`toast ${t.type}`},t.msg))
    )
  );
}

// ═══════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════
function LoginPage({onLogin}){
  const [u,setU]=useState('');const [p,setP]=useState('');const [err,setErr]=useState('');const [loading,setLoading]=useState(false);
  const submit = async(e)=>{
    e.preventDefault();setErr('');setLoading(true);
    const r = await API.call({action:'login',username:u,password:p});
    setLoading(false);
    if(r.success&&r.data&&!r.data.error) onLogin(r.data);
    else setErr(r.data?.error||r.error||'Login failed. Check credentials or API URL in Settings.');
  };
  return React.createElement('div',{className:'login-wrap'},
    React.createElement('div',{className:'login-card'},

function StaffModal({staff,onSave,onClose}){
  const isEdit=!!staff;
  const [f,setF]=useState(staff?{...staff,password:''}:{name:'',username:'',password:'',role:'staff',permissions:''});
  const [selPerms,setSelPerms]=useState(()=>{
    if(!staff||staff.permissions==='all')return staff?.permissions==='all'?['all']:[];
    return (staff.permissions||'').split(',').map(s=>s.trim()).filter(Boolean);
  });
  const [saving,setSaving]=useState(false);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const togglePerm=p=>{
    if(p==='all'){setSelPerms(['all']);return;}
    setSelPerms(prev=>{
      const n=prev.filter(x=>x!=='all');
      return n.includes(p)?n.filter(x=>x!==p):[...n,p];
    });
  };
  const save=async()=>{
    const perms=selPerms.includes('all')?'all':selPerms.join(',');
    const data={...f,permissions:perms};
    if(isEdit&&!data.password)delete data.password;
    setSaving(true);
    const r=await API.call(isEdit?{action:'updateStaff',id:staff.id,staff:JSON.stringify(data)}:{action:'addStaff',staff:JSON.stringify(data)});
    setSaving(false);
    if(r.success)onSave();else toast(r.error,'error');
  };
  return React.createElement('div',{className:'modal-overlay',onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    React.createElement('div',{className:'modal'},
      React.createElement('div',{className:'modal-header'},
        React.createElement('div',{className:'modal-title'},isEdit?'Edit Staff':'Add Staff Member'),
        React.createElement('button',{className:'close-btn',onClick:onClose},'×')
      ),
      React.createElement('div',{className:'modal-body'},
        React.createElement('div',{className:'form-grid form-grid-2',style:{marginBottom:14}},
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Full Name'),React.createElement('input',{className:'form-input',value:f.name||'',onChange:set('name')})),
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Username'),React.createElement('input',{className:'form-input',value:f.username||'',onChange:set('username')}))
        ),
        React.createElement('div',{className:'form-grid form-grid-2',style:{marginBottom:14}},
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},isEdit?'New Password (leave blank to keep)':'Password'),React.createElement('input',{className:'form-input',type:'password',value:f.password||'',onChange:set('password')})),
          React.createElement('div',{className:'form-group'},React.createElement('label',{className:'form-label'},'Role'),
            React.createElement('select',{className:'form-select',value:f.role||'staff',onChange:set('role')},
              ['staff','customer_care','manager','admin'].map(r=>React.createElement('option',{key:r,value:r},r))
            )
          )
        ),
        React.createElement('div',{className:'form-group'},
          React.createElement('label',{className:'form-label'},'Permissions'),
          React.createElement('div',{className:'permission-grid'},
            ['all',...PERMS_LIST].map(p=>
              React.createElement('div',{key:p,className:`perm-chip ${selPerms.includes(p)?'active':''}`,onClick:()=>togglePerm(p)},
                selPerms.includes(p)?'✓ ':'',(p==='all'?'All Permissions':p.replace(/_/g,' '))
              )
            )
          )
        )
      ),
      React.createElement('div',{className:'modal-footer'},
        React.createElement('button',{className:'btn btn-secondary',onClick:onClose},'Cancel'),
        React.createElement('button',{className:'btn btn-primary',onClick:save,disabled:saving},saving?'Saving…':'Save Staff')
      )
    )
  );
}
