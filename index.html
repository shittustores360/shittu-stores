<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#161a23;--bg3:#1e2330;--bg4:#252c3d;
  --border:#2a3248;--border2:#3a4560;
  --accent:#7c6af7;--accent2:#6b5de8;--accent-dim:rgba(124,106,247,0.12);
  --green:#00c896;--green-dim:rgba(0,200,150,0.12);
  --red:#f05252;--red-dim:rgba(240,82,82,0.12);
  --blue:#38bdf8;--blue-dim:rgba(56,189,248,0.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.12);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,0.12);
  --text:#e2e8f8;--text2:#8892aa;--text3:#4a5470;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:8px;--radius-lg:14px;--shadow:0 4px 32px rgba(0,0,0,0.5);--transition:0.15s ease;
  --card-bg:rgba(22,26,35,0.9);
}
[data-theme="light"]{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#f0f2f8;--bg4:#e8ecf5;
  --border:#dde3f0;--border2:#c8d0e8;
  --text:#1a1e30;--text2:#4a5272;--text3:#8890b0;
  --shadow:0 4px 24px rgba(0,0,0,0.08);--card-bg:#ffffff;
  --accent-dim:rgba(124,106,247,0.08);--green-dim:rgba(0,200,150,0.08);--red-dim:rgba(240,82,82,0.08);--blue-dim:rgba(56,189,248,0.08);--purple-dim:rgba(167,139,250,0.08);--orange-dim:rgba(251,146,60,0.08);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background 0.2s,color 0.2s}
#root{height:100%}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--transition)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}
.sidebar-logo{padding:18px 16px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.logo-row{display:flex;align-items:center;gap:9px}
.logo-text{font-family:var(--font-head);font-size:16px;font-weight:800;color:var(--text);letter-spacing:-0.3px}
.logo-sub{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-top:1px}
.nav-section{padding:6px 8px 0;margin-bottom:2px}
.nav-section-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:1px;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{margin-top:auto;padding:10px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius);background:var(--bg3)}
.user-avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:var(--text)}
.user-role{font-size:10px;color:var(--text3);text-transform:capitalize}
.topbar-title{font-family:var(--font-head);font-size:15px;font-weight:700;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:var(--font-body)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,82,82,0.2)}.btn-danger:hover{background:rgba(240,82,82,0.2)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,200,150,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;transition:border-color var(--transition)}
.kpi-card:hover{border-color:var(--border2)}
.kpi-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.kpi-value{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.kpi-delta{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
.delta-up{color:var(--green)}.delta-dn{color:var(--red)}.delta-neu{color:var(--text3)}
.chart-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.chart-sub{font-size:11px;color:var(--text3);margin-bottom:14px}
.chart-svg{width:100%;display:block;overflow:visible}
.overview-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:900px){.overview-grid{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.td-mono{font-family:var(--font-mono);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-delivered,.badge-confirmed{background:var(--green-dim);color:var(--green)}
.badge-canceled{background:var(--red-dim);color:var(--red)}
.badge-rescheduled{background:var(--blue-dim);color:var(--blue)}
.badge-notconfirmed{background:var(--purple-dim);color:var(--purple)}
.badge-noresponse{background:rgba(74,84,112,0.15);color:var(--text3)}
.badge-processing{background:var(--orange-dim);color:var(--orange)}
.badge-paid{background:var(--green-dim);color:var(--green)}
.badge-unpaid{background:var(--red-dim);color:var(--red)}
.badge-uncontacted{background:rgba(74,84,112,0.15);color:var(--text3)}
.badge-contacted{background:var(--blue-dim);color:var(--blue)}
.form-grid{display:grid;gap:12px}
.form-grid-2{grid-template-columns:1fr 1fr}.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color var(--transition);width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-input[readonly]{background:var(--bg4);border-color:var(--border);color:var(--text2)}
.form-select option{background:var(--bg2)}.form-textarea{resize:vertical;min-height:68px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-lg{max-width:820px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-title{font-family:var(--font-head);font-size:15px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg2)}
.close-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;border-radius:6px;line-height:1}.close-btn:hover{color:var(--text);background:var(--bg3)}
.filters-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;width:200px;transition:border-color var(--transition)}.search-input:focus{border-color:var(--accent)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:38px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;margin-bottom:14px}
.login-title{font-family:var(--font-head);font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px}
.login-sub{color:var(--text3);font-size:13px;margin-bottom:28px}
.login-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,82,82,0.25);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:14px}
.setup-banner{background:var(--orange-dim);border:1px solid rgba(251,146,60,0.3);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.tabs{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:var(--radius);width:fit-content;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition)}.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.25)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-title{font-family:var(--font-head);font-size:16px;font-weight:700}
.section-sub{font-size:11px;color:var(--text3);margin-top:2px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 15px;font-size:13px;box-shadow:var(--shadow);animation:slideIn 0.2s ease;min-width:200px}
.toast.success{border-color:rgba(0,200,150,0.3);color:var(--green)}.toast.error{border-color:rgba(240,82,82,0.3);color:var(--red)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{display:flex;align-items:center;justify-content:center;height:180px;gap:10px;color:var(--text3)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text3);gap:8px}
.empty-icon{font-size:36px;opacity:0.25}.empty-text{font-size:13px}
.profit-positive{color:var(--green);font-family:var(--font-mono);font-size:12px}
.profit-negative{color:var(--red);font-family:var(--font-mono);font-size:12px}
.text-muted{color:var(--text3);font-size:12px}
.permission-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.perm-chip{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all var(--transition)}.perm-chip.active{background:var(--accent-dim);border-color:rgba(124,106,247,0.3);color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid rgba(124,106,247,0.25);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:11px}
.tag-remove{cursor:pointer;opacity:0.7}.tag-remove:hover{opacity:1}
.section-divider{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:14px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.alert-info{background:var(--blue-dim);border:1px solid rgba(56,189,248,0.2);border-radius:var(--radius);padding:9px 13px;font-size:12px;color:var(--blue);margin-bottom:11px}
.alert-warning{background:var(--orange-dim);border:1px solid rgba(251,146,60,0.25);border-radius:var(--radius);padding:9px 13px;font-size:12px;color:var(--orange);margin-bottom:11px}
.price-history-item{background:var(--bg3);border-radius:7px;padding:7px 11px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.product-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:all var(--transition)}.product-chip.active{background:var(--accent-dim);border-color:rgba(124,106,247,0.3);color:var(--accent)}
.theme-toggle{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 10px;cursor:pointer;color:var(--text2);font-size:12px;display:flex;align-items:center;gap:5px;transition:all var(--transition)}.theme-toggle:hover{color:var(--text)}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99}
.bar-wrap{background:var(--bg4);border-radius:3px;height:5px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.bundle-info-card{background:var(--bg3);border:2px solid var(--border2);border-radius:var(--radius);padding:14px;margin-top:8px}
.bundle-info-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.bundle-info-row:last-child{border-bottom:none}
.bundle-info-label{color:var(--text3)}
.bundle-info-val{font-family:var(--font-mono);color:var(--text);font-weight:600}
.free-gift-badge{display:inline-flex;align-items:center;gap:4px;background:var(--green-dim);color:var(--green);border:1px solid rgba(0,200,150,0.25);border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600}
.custom-order-fields{background:var(--bg3);border:1px solid var(--orange);border-radius:var(--radius);padding:14px;margin-top:8px}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.radio-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all var(--transition);color:var(--text2)}.radio-pill.active{background:var(--green-dim);border-color:rgba(0,200,150,0.3);color:var(--green)}
.radio-pill input[type=radio]{display:none}
.staff-info-box{background:var(--blue-dim);border:1px solid rgba(56,189,248,0.2);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--blue);margin-bottom:12px}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}.hamburger{display:block}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}.content{padding:14px}
  .filters-bar{flex-direction:column;align-items:stretch}.search-input{width:100%}
  .overview-grid{grid-template-columns:1fr}
}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,useMemo,createContext,useContext}=React;

// ─── CACHE ─────────────────────────────────────────────────────────────────
const _cache={};const CACHE_TTL=60000;
function cacheGet(k){const e=_cache[k];if(e&&Date.now()-e.ts<CACHE_TTL)return e.v;return null;}
function cacheSet(k,v){_cache[k]={v,ts:Date.now()};}
function cacheBust(){Object.keys(_cache).forEach(k=>delete _cache[k]);}

// ─── API ───────────────────────────────────────────────────────────────────
const API={
  url:localStorage.getItem('apiUrl')||'',
  setUrl(u){this.url=u;localStorage.setItem('apiUrl',u);},
  async call(params){
    if(!this.url)return{success:false,error:'No API URL.'};
    const key=JSON.stringify(params);
    const isRead=(params.action||'').startsWith('get');
    if(isRead){const c=cacheGet(key);if(c)return c;}
    try{
      const r=await fetch(this.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(params)});
      if(!r.ok)return{success:false,error:'HTTP '+r.status};
      const t=await r.text();let d;
      try{d=JSON.parse(t);}catch{return{success:false,error:'Bad JSON response'};}
      if(isRead&&d.success)cacheSet(key,d);
      if(!isRead&&d.success)cacheBust();
      return d;
    }catch(e){return{success:false,error:e.message};}
  }
};

// ─── THEME ─────────────────────────────────────────────────────────────────
const ThemeCtx=createContext({theme:'dark',toggleTheme:()=>{}});
function ThemeProvider({children}){
  const[theme,setTheme]=useState(()=>localStorage.getItem('ssTheme')||'dark');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme==='light'?'light':'');localStorage.setItem('ssTheme',theme);},[theme]);
  const toggleTheme=useCallback(()=>setTheme(t=>t==='dark'?'light':'dark'),[]);
  return React.createElement(ThemeCtx.Provider,{value:{theme,toggleTheme}},children);
}

// ─── TOAST ─────────────────────────────────────────────────────────────────
let _toastFn=null;
function useToast(){
  const[toasts,setToasts]=useState([]);
  useEffect(()=>{_toastFn=(msg,type='success')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);};},[]);
  return toasts;
}
const toast=(msg,type)=>_toastFn&&_toastFn(msg,type);

// ─── CONSTANTS ─────────────────────────────────────────────────────────────
const DELIVERY_STATUSES=['Not Confirmed','Processing','Rescheduled','Confirmed','Delivered','Canceled','No Response'];
const CONTACT_STATUSES=['Uncontacted','Contacted'];
const PAYMENT_OPTIONS=['Paid','Unpaid'];
// Staff permissions — fixed set for customer_care role
const CC_PERMISSIONS='view_orders,add_orders,edit_orders';
const PERMS_LIST=['view_orders','add_orders','edit_orders','delete_orders','view_financials','view_dashboard','manage_expenses'];
const STAFF_PAYOUT_NGN=2000;

// ─── UTILS ─────────────────────────────────────────────────────────────────
function sp(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function fmt(n,d=2){const v=parseFloat(n);return isNaN(v)?'—':v.toFixed(d);}
function fmtGHC(n){return'GH\u20B5'+fmt(n,2);}

// BUG FIX: was stuck in loading spinner when API.url is empty
function useData(action,enabled=true){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(!!enabled);
  const[error,setError]=useState('');
  const load=useCallback(async()=>{
    if(!enabled){setLoading(false);return;}
    if(!API.url){setLoading(false);setError('No API URL configured.');return;}
    setLoading(true);setError('');
    const r=await API.call({action});
    setLoading(false);
    if(r.success)setData(r.data||[]);
    else setError(r.error||'Failed');
  },[action,enabled]);
  useEffect(()=>{load();},[load]);
  return{data,loading,error,reload:load};
}
