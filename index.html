<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#12151c;--bg3:#1a1e28;--bg4:#222838;
  --border:#2a3040;--border2:#38435a;
  --accent:#f5a623;--accent2:#e8912a;--accent-dim:rgba(245,166,35,0.12);
  --green:#2ecc71;--green-dim:rgba(46,204,113,0.12);
  --red:#e74c3c;--red-dim:rgba(231,76,60,0.12);
  --blue:#3498db;--blue-dim:rgba(52,152,219,0.12);
  --purple:#9b59b6;--purple-dim:rgba(155,89,182,0.12);
  --text:#e8eaf0;--text2:#9aa0b4;--text3:#5a6070;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:16px;--shadow:0 4px 24px rgba(0,0,0,0.4);--transition:0.18s ease;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background 0.2s,color 0.2s}
#root{height:100%}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}
.sidebar-logo{padding:20px 16px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-text{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.nav-section{padding:8px 8px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:2px}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(245,166,35,0.2)}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;}
.stat-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-family:var(--font-head);font-size:20px;font-weight:700;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition)}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;background:var(--bg3)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;width:100%;outline:none}
.form-input[readonly]{background:var(--bg4);color:var(--text3);cursor:not-allowed}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto}
.section-divider{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.bundle-item-card{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:15px;margin-bottom:12px}
.radio-group{display:flex;gap:15px;margin-top:5px}
.radio-label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.locked-info{background:var(--accent-dim);border:1px solid rgba(245,166,35,0.2);padding:10px;border-radius:8px;margin-bottom:15px;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>

function App() {

    {id:'orders', icon:'📦', label:'Orders'},
    {id:'analytics', icon:'📈', label:'Analytics'},
    {id:'products', icon:'🏷️', label:'Products', admin:true},
    {id:'staff', icon:'👥', label:'Staff', admin:true}

  return React.createElement('div', {className:'app'},
    React.createElement('aside', {className:'sidebar'},
      React.createElement('div', {className:'sidebar-logo'}, React.createElement('div', {className:'logo-text'}, 'SHITTU STORES')),
      React.createElement('div', {className:'nav-section'}, nav.map(n => React.createElement('div', {

      React.createElement('div', {className:'sidebar-footer'},

        React.createElement('button', {className:'btn btn-secondary btn-sm', style:{width:'100%', marginTop:10}, onClick: () => { setUser(null); localStorage.removeItem('ssUser'); }}, 'Logout')

      React.createElement('div', {className:'content'},
        page === 'dashboard' && React.createElement(DashboardPage, {user}),
        page === 'orders' && React.createElement(OrdersPage, {user}),
        page === 'analytics' && React.createElement(AnalyticsPage, {user}),
        page === 'products' && React.createElement(ProductsPage),
        page === 'staff' && React.createElement(StaffPage)
      )
    )
  );
}

          products.map(p => React.createElement('option', { key: p.id }, p.name))

        React.createElement('select', { className: 'form-select', onChange: e => handleBundle(e.target.value), style: { marginBottom: 15 } },
          React.createElement('option', null, '-- Select Bundle --'),

          React.createElement('option', { value: 'CUSTOM' }, '✏️ Custom Order')

        !f.isCustom && f.bundle && React.createElement('div', {className:'locked-info'}, "Fields locked. Prices are set by the bundle."),
        React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 } },
          React.createElement('div', null, React.createElement('div', { className: 'stat-label' }, 'Selling Price'), React.createElement('input', { className: 'form-input', type: 'number', value: f.price, readOnly: !f.isCustom, onChange: e => setF({ ...f, price: e.target.value }) })),
          React.createElement('div', null, React.createElement('div', { className: 'stat-label' }, 'Cost Price'), React.createElement('input', { className: 'form-input', type: 'number', value: f.cost, readOnly: !f.isCustom, onChange: e => setF({ ...f, cost: e.target.value }) })),
          React.createElement('div', null, React.createElement('div', { className: 'stat-label' }, 'Quantity'), React.createElement('input', { className: 'form-input', type: 'number', value: f.qty, readOnly: !f.isCustom, onChange: e => setF({ ...f, qty: e.target.value }) }))
        )
      ),
      React.createElement('div', { className: 'modal-footer' }, React.createElement('button', { className: 'btn btn-secondary', onClick: onClose }, 'Cancel'), React.createElement('button', { className: 'btn btn-primary', onClick: save }, 'Place Order'))
    )
  );
}

function ProductModal({ product, onClose, onRefresh }) {
  const [f, setF] = useState(product ? { ...product, bundles: JSON.parse(product.bundles || '[]') } : { name: '', bundles: [] });
  
  const addB = () => setF({ ...f, bundles: [...f.bundles, { label: '', qty: 1, sellingPrice: 0, costPrice: 0, hasFreeGift: false, giftCost: 0 }] });
  const updB = (i, k, v) => { const b = [...f.bundles]; b[i][k] = v; setF({ ...f, bundles: b }); };

    React.createElement('div', { className: 'modal' },
      React.createElement('div', { style:{padding:20, borderBottom:'1px solid var(--border)'}, className:'modal-title' }, 'Product Configuration'),

        React.createElement('div', {className:'section-divider'}, 'Bundles & Gifts'),

          React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 } },

             React.createElement('div', null, React.createElement('div', {className:'stat-label'},'Selling Price'), React.createElement('input', {className:'form-input', type:'number', value:b.sellingPrice, onChange:e=>updB(i,'sellingPrice',e.target.value)})),

          React.createElement('div', {style:{marginTop:15}},

                React.createElement('label', {className:'radio-label'}, React.createElement('input', {type:'radio', checked:b.hasFreeGift, onChange:()=>updB(i,'hasFreeGift', true)}), 'Yes'),
                React.createElement('label', {className:'radio-label'}, React.createElement('input', {type:'radio', checked:!b.hasFreeGift, onChange:()=>updB(i,'hasFreeGift', false)}), 'No')
             ),
             b.hasFreeGift && React.createElement('div', {style:{marginTop:10}}, 
                React.createElement('div', {className:'stat-label'}, 'Gift Cost (Added to bundle cost)'),
                React.createElement('input', {className:'form-input', type:'number', value:b.giftCost, onChange:e=>updB(i, 'giftCost', e.target.value)})
             )
          )
        )),
        React.createElement('button', { className: 'btn btn-secondary', style: { width: '100%' }, onClick: addB }, '+ Add Bundle Option')
      ),
      React.createElement('div', { className: 'modal-footer' }, React.createElement('button', { className: 'btn btn-secondary', onClick: onClose }, 'Cancel'), React.createElement('button', { className: 'btn btn-primary', onClick: save }, 'Save Product'))
    )
  );
}

function DashboardPage({ user }) {
  const [data, setData] = useState(null);
  useEffect(() => { API.call({ action: 'getDashboard', username: user.username, role: user.role }).then(r => r.success && setData(r.data)); }, []);
  return React.createElement('div', null,
    React.createElement('h2', { style: { marginBottom: 20 } }, 'Welcome, ' + user.name),
    React.createElement('div', { className: 'stat-grid' },
      React.createElement('div', {className:'stat-card'}, React.createElement('div', {className:'stat-label'}, 'Revenue'), React.createElement('div', {className:'stat-value', style:{color:'var(--green)'}}, data?.revenue || 'GHC 0')),
      React.createElement('div', {className:'stat-card'}, React.createElement('div', {className:'stat-label'}, 'Total Orders'), React.createElement('div', {className:'stat-value'}, data?.totalOrders || '0')),
      React.createElement('div', {className:'stat-card'}, React.createElement('div', {className:'stat-label'}, 'Conversion'), React.createElement('div', {className:'stat-value', style:{color:'var(--accent)'}}, (data?.conversion || '0') + '%')),
      React.createElement('div', {className:'stat-card'}, React.createElement('div', {className:'stat-label'}, 'Commission Due'), React.createElement('div', {className:'stat-value', style:{color:'var(--purple)'}}, '₦' + (data?.pendingPayout || '0')))
    )
  );
}

function OrdersPage({ user }) {
  const [orders, setOrders] = useState([]);
  const [prods, setProds] = useState([]);
  const [modal, setModal] = useState(false);
  const refresh = () => { API.call({ action: 'getOrders' }).then(r => r.success && setOrders(r.data)); API.call({ action: 'getProducts' }).then(r => r.success && setProds(r.data)); };
  useEffect(() => refresh(), []);
  return React.createElement('div', null,
    React.createElement('div', { style: { display:'flex', justifyContent:'space-between', marginBottom:20 } }, React.createElement('h2', null, 'Orders'), React.createElement('button', { className:'btn btn-primary', onClick:()=>setModal(true) }, '+ New Order')),
    React.createElement('div', { className:'card' }, React.createElement('table', null, React.createElement('thead', null, React.createElement('tr', null, ['Customer','Product','Bundle','Total','Status'].map(h => React.createElement('th', null, h)))), React.createElement('tbody', null, orders.map(o => React.createElement('tr', { key:o.id }, React.createElement('td', null, o.customerName), React.createElement('td', null, o.product), React.createElement('td', null, o.bundleLabel), React.createElement('td', null, 'GHC '+o.sellingPrice), React.createElement('td', null, React.createElement('span', {className:'badge badge-processing'}, o.deliveryStatus)))))))
    , modal && React.createElement(OrderModal, { products: prods, user, onClose: () => setModal(false), onRefresh: refresh })
  );
}

function AnalyticsPage({ user }) {
  const [orders, setOrders] = useState([]);
  useEffect(() => { API.call({ action: 'getOrders' }).then(r => { if(r.success) setOrders(r.data.filter(o => user.role === 'admin' || o.createdBy === user.username)); }); }, []);
  return React.createElement('div', null, React.createElement('h2', {style:{marginBottom:20}}, user.role === 'admin' ? 'Store Analytics' : 'My Performance'), React.createElement('div', {className:'card'}, React.createElement('div', {className:'stat-label', style:{marginBottom:20}}, 'Conversion Funnel'), ['Processing', 'Delivered', 'Canceled'].map(s => {
    const count = orders.filter(o => o.deliveryStatus === s).length;
    const pct = orders.length ? (count / orders.length * 100).toFixed(0) : 0;
    return React.createElement('div', { key: s, style: { marginTop: 15 } }, React.createElement('div', { style: { display:'flex', justifyContent:'space-between', fontSize:12, marginBottom:5 } }, React.createElement('span', null, s), React.createElement('span', null, count + ' ('+pct+'%)')), React.createElement('div', { style: { height:6, background:'var(--bg4)', borderRadius:3 } }, React.createElement('div', { style: { width: pct+'%', height:'100%', background:'var(--accent)', borderRadius:3 } })));
  })));
}

function ProductsPage() {
  const [list, setList] = useState([]);
  const [modal, setModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const refresh = () => API.call({ action: 'getProducts' }).then(r => r.success && setList(r.data));
  useEffect(() => refresh(), []);
  return React.createElement('div', null, React.createElement('div', { style: { display:'flex', justifyContent:'space-between', marginBottom:20 } }, React.createElement('h2', null, 'Products'), React.createElement('button', { className:'btn btn-primary', onClick:()=> { setEditing(null); setModal(true); } }, '+ Add Product')),
    React.createElement('div', { className:'card' }, React.createElement('table', null, React.createElement('thead', null, React.createElement('tr', null, ['Name','Bundles','Status','Action'].map(h => React.createElement('th', null, h)))), React.createElement('tbody', null, list.map(p => React.createElement('tr', { key:p.id }, React.createElement('td', null, p.name), React.createElement('td', null, JSON.parse(p.bundles || '[]').length), React.createElement('td', null, React.createElement('span', {className:'badge badge-delivered'}, 'Active')), React.createElement('td', null, React.createElement('button', {className:'btn btn-secondary btn-sm', onClick:()=> { setEditing(p); setModal(true); }}, 'Edit')))))))
    , modal && React.createElement(ProductModal, { product: editing, onClose: () => setModal(false), onRefresh: refresh })
  );
}

function StaffPage() {
  const [staff, setStaff] = useState([]);
  useEffect(() => { API.call({ action: 'getStaff' }).then(r => r.success && setStaff(r.data)); }, []);
  return React.createElement('div', { className:'card' }, React.createElement('h2', {style:{marginBottom:15}}, 'Staff Access'), React.createElement('table', null, React.createElement('thead', null, React.createElement('tr', null, ['Name','Username','Role'].map(h => React.createElement('th', null, h)))), React.createElement('tbody', null, staff.map(s => React.createElement('tr', { key:s.id }, React.createElement('td', null, s.name), React.createElement('td', null, s.username), React.createElement('td', null, s.role))))));
}

function LoginPage({ onLogin }) {
  const [u, setU] = useState(''); const [p, setP] = useState('');
  const handle = async () => { const r = await API.call({ action: 'login', username: u, password: p }); if (r.success && !r.data.error) onLogin(r.data); else alert('Login Failed'); };
  return React.createElement('div', { style: { height:'100vh', display:'grid', placeItems:'center', background:'var(--bg)' } }, React.createElement('div', { className:'card', style: { width:320, textAlign:'center' } }, React.createElement('h1', { style: { color:'var(--accent)', fontFamily:'var(--font-head)', marginBottom:20 } }, 'SHITTU STORES'), React.createElement('input', { className:'form-input', placeholder:'Username', onChange: e => setU(e.target.value), style: { marginBottom:10 } }), React.createElement('input', { className:'form-input', type:'password', placeholder:'Password', onChange: e => setP(e.target.value), style: { marginBottom:20 } }), React.createElement('button', { className:'btn btn-primary', style: { width:'100%' }, onClick: handle }, 'Sign In')));
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
