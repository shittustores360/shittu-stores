<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shittu Stores — Business Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Premium dark-fintech surfaces (deep charcoal, not pure black) ── */
  --bg:#08090d;--bg2:#0e1016;--bg3:#151822;--bg4:#1c202c;
  --surface-glass:rgba(20,23,32,0.72);--surface-glass-solid:#12141c;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --border-strong:rgba(255,255,255,0.2);
  --accent:#f5a623;--accent2:#ffc247;--accent-ink:#1a1000;
  --accent-dim:rgba(245,166,35,0.13);--accent-glow:rgba(245,166,35,0.38);
  --green:#34d399;--green-dim:rgba(52,211,153,0.13);
  --red:#f87171;--red-dim:rgba(248,113,113,0.13);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.13);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.13);
  --text:#f2f3f7;--text2:#9298ab;--text3:#575d70;
  --font-head:'Syne',sans-serif;--font-body:'Inter','DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  --radius:10px;--radius-lg:16px;--radius-xl:20px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
  --shadow-md:0 8px 24px -8px rgba(0,0,0,0.55), 0 2px 8px -2px rgba(0,0,0,0.4);
  --shadow-lg:0 24px 64px -20px rgba(0,0,0,0.65), 0 8px 24px -8px rgba(0,0,0,0.5);
  --shadow-glow-accent:0 0 0 1px rgba(245,166,35,0.18), 0 8px 28px -6px rgba(245,166,35,0.28);
  --shadow:var(--shadow-lg);
  --inset-hairline:inset 0 1px 0 rgba(255,255,255,0.06);
  --transition:0.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#eef0f5;--bg2:#ffffff;--bg3:#f4f5f9;--bg4:#e9ebf2;
  --surface-glass:rgba(255,255,255,0.72);--surface-glass-solid:#ffffff;
  --border:rgba(15,18,30,0.08);--border2:rgba(15,18,30,0.14);
  --border-strong:rgba(15,18,30,0.22);
  --accent-ink:#1a1000;
  --text:#12141c;--text2:#565c70;--text3:#8991a6;
  --shadow-sm:0 1px 2px rgba(20,22,40,0.05);
  --shadow-md:0 8px 24px -10px rgba(20,22,40,0.14), 0 2px 6px -2px rgba(20,22,40,0.08);
  --shadow-lg:0 24px 56px -24px rgba(20,22,40,0.22), 0 4px 16px -4px rgba(20,22,40,0.1);
  --shadow-glow-accent:0 0 0 1px rgba(245,166,35,0.22), 0 8px 24px -8px rgba(245,166,35,0.22);
  --shadow:var(--shadow-lg);
  --inset-hairline:inset 0 1px 0 rgba(255,255,255,0.6);
  --accent-dim:rgba(245,166,35,0.1);
  --green-dim:rgba(16,150,105,0.1);--red-dim:rgba(220,38,38,0.09);--blue-dim:rgba(37,99,235,0.09);--purple-dim:rgba(124,58,237,0.09);
  --green:#0d9668;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;transition:background 0.2s,color 0.2s;-webkit-font-smoothing:antialiased}
body{
  background-image:radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(245,166,35,0.05), transparent 60%),
                    radial-gradient(ellipse 900px 500px at 100% 0%, rgba(96,165,250,0.04), transparent 55%);
  background-attachment:fixed;
}
#root{height:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
svg.icon{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:232px;background:var(--surface-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--transition);position:relative;z-index:10}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{height:60px;background:var(--surface-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:5}
.content{flex:1;overflow-y:auto;padding:26px 28px 40px}
.sidebar-logo{padding:22px 18px 16px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#c9761a);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px -2px rgba(245,166,35,0.5),var(--inset-hairline)}
.logo-mark svg{width:16px;height:16px;stroke:#1a1000;stroke-width:2.4}
.logo-text{font-family:var(--font-head);font-size:16.5px;font-weight:800;color:var(--text);letter-spacing:-0.4px;line-height:1.15}
.logo-sub{font-size:10.5px;color:var(--text3);font-family:var(--font-mono);letter-spacing:0.2px}
.nav-section{padding:10px 10px 0;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all var(--transition);margin-bottom:2px;position:relative}
.nav-item svg{opacity:0.75;transition:opacity var(--transition)}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item:hover svg{opacity:1}
.nav-item.active{background:linear-gradient(135deg,rgba(245,166,35,0.14),rgba(245,166,35,0.05));color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px rgba(245,166,35,0.22)}
.nav-item.active svg{opacity:1;filter:drop-shadow(0 0 6px rgba(245,166,35,0.5))}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--bg3);border:1px solid var(--border)}
.user-avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#c9761a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--accent-ink);flex-shrink:0;box-shadow:0 2px 8px -2px rgba(245,166,35,0.5)}
.user-name{font-size:12.5px;font-weight:600;color:var(--text)}
.user-role{font-size:10px;color:var(--text3);text-transform:capitalize}
.topbar-title{font-family:var(--font-head);font-size:15.5px;font-weight:700;flex:1;letter-spacing:-0.2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:var(--font-body);letter-spacing:-0.1px}
.btn:disabled{opacity:0.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(155deg,var(--accent2),var(--accent));color:var(--accent-ink);box-shadow:var(--shadow-glow-accent),var(--inset-hairline)}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 0 0 1px rgba(245,166,35,0.25),0 12px 32px -6px rgba(245,166,35,0.4),var(--inset-hairline)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2);box-shadow:var(--shadow-sm)}.btn-secondary:hover:not(:disabled){background:var(--bg4);border-color:var(--border-strong)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,0.22)}.btn-danger:hover:not(:disabled){background:rgba(248,113,113,0.2)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,0.22)}
.btn-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(96,165,250,0.22)}.btn-blue:hover:not(:disabled){background:rgba(96,165,250,0.2)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-xs{padding:3px 7px;font-size:11px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-md),var(--inset-hairline)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:26px}
.stat-card{background:linear-gradient(165deg,var(--bg3) 0%,var(--bg2) 65%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm),var(--inset-hairline);transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition)}
.stat-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;opacity:0.10;filter:blur(2px)}
.stat-card.orange::before{background:var(--accent)}.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}.stat-card.blue::before{background:var(--blue)}.stat-card.purple::before{background:var(--purple)}
.stat-icon-chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;z-index:1}
.stat-card.orange .stat-icon-chip{background:var(--accent-dim);color:var(--accent)}
.stat-card.green .stat-icon-chip{background:var(--green-dim);color:var(--green)}
.stat-card.red .stat-icon-chip{background:var(--red-dim);color:var(--red)}
.stat-card.blue .stat-icon-chip{background:var(--blue-dim);color:var(--blue)}
.stat-card.purple .stat-icon-chip{background:var(--purple-dim);color:var(--purple)}
.stat-icon-chip svg{width:15px;height:15px}
.stat-card.clickable{cursor:pointer}
.stat-card.clickable:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--shadow-md),var(--inset-hairline)}
.stat-card.featured{grid-column:span 2;border:1px solid rgba(245,166,35,0.3);background:linear-gradient(155deg,rgba(245,166,35,0.10),var(--bg2) 55%);box-shadow:var(--shadow-md),var(--inset-hairline)}
.stat-card.featured .stat-value{font-size:29px;letter-spacing:-0.5px}
.stat-label{font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;position:relative;z-index:1}
.stat-value{font-family:var(--font-head);font-size:21px;font-weight:700;color:var(--text);letter-spacing:-0.3px;position:relative;z-index:1}
.stat-sub{font-size:11.5px;color:var(--text3);margin-top:5px;position:relative;z-index:1;line-height:1.5}
.stat-click-hint{font-size:10px;color:var(--accent);margin-top:7px;opacity:0.9;font-weight:600;position:relative;z-index:1}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:11px 14px;text-align:left;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr{transition:background var(--transition)}
tr:hover td{background:var(--bg3)}
.td-mono{font-family:var(--font-mono);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:0.85}
.badge-delivered{background:var(--green-dim);color:var(--green)}
.badge-canceled{background:var(--red-dim);color:var(--red)}
.badge-rescheduled{background:var(--blue-dim);color:var(--blue)}
.badge-notconfirmed{background:var(--purple-dim);color:var(--purple)}
.badge-noresponse{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-processing{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-confirmed{background:var(--green-dim);color:var(--green)}
.badge-paid{background:var(--green-dim);color:var(--green)}
.badge-unpaid{background:var(--red-dim);color:var(--red)}
.badge-uncontacted{background:rgba(90,96,112,0.15);color:var(--text3)}
.badge-contacted{background:var(--blue-dim);color:var(--blue)}
.badge-supplier{background:var(--purple-dim);color:var(--purple)}
.badge-unassigned{background:rgba(245,166,35,0.15);color:var(--accent)}
.badge-email-set{background:var(--green-dim);color:var(--green)}
.badge-email-missing{background:var(--red-dim);color:var(--red)}
.badge-ready{background:var(--green-dim);color:var(--green)}
.badge-notready{background:rgba(245,166,35,0.15);color:var(--accent)}
.form-grid{display:grid;gap:14px}
.form-grid-2{grid-template-columns:1fr 1fr}.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px}
.form-input,.form-select,.form-textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:all var(--transition)}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,166,35,0.12)}
.form-input:disabled,.form-select:disabled{opacity:0.5;cursor:not-allowed}
.form-select option{background:var(--bg3)}.form-textarea{resize:vertical;min-height:70px}
.modal-overlay{position:fixed;inset:0;background:rgba(4,5,8,0.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.modal{background:var(--surface-glass-solid);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-lg{max-width:860px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface-glass-solid);z-index:2}
.modal-title{font-family:var(--font-head);font-size:16px;font-weight:700;letter-spacing:-0.2px}
.modal-body{padding:22px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface-glass-solid)}
.close-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;border-radius:8px;line-height:1;transition:all var(--transition);display:inline-flex}
.close-btn:hover{color:var(--text);background:var(--bg3)}
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;width:220px;transition:border-color var(--transition)}
.search-input:focus{border-color:var(--accent)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px;position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 700px 500px at 50% 0%,rgba(245,166,35,0.09),transparent 60%);pointer-events:none}
.login-card{background:var(--surface-glass-solid);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:40px;width:100%;max-width:400px;box-shadow:var(--shadow-lg),var(--inset-hairline);position:relative;z-index:1}
.login-logo{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-0.5px}
.login-sub{color:var(--text3);font-size:13px;margin-bottom:32px}
.login-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,0.25);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px}
.signup-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,0.25);border-radius:var(--radius);padding:14px;font-size:13px;margin-bottom:16px;text-align:center}
.tabs{display:flex;gap:3px;background:var(--bg3);padding:4px;border-radius:11px;width:fit-content;margin-bottom:20px;flex-wrap:wrap;border:1px solid var(--border)}
.tab{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all var(--transition)}
.tab.active{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow-sm),0 0 0 1px var(--border2)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:-0.3px}
.section-sub{font-size:12px;color:var(--text3);margin-top:2px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-glass-solid);backdrop-filter:blur(12px);border:1px solid var(--border2);border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:var(--shadow-lg);animation:slideIn 0.3s cubic-bezier(.2,.9,.3,1.3);min-width:220px;font-weight:500}
.toast.success{border-color:rgba(52,211,153,0.35);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,0.35);color:var(--red)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.18);border-top-color:currentColor;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-full{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text3)}
.loading-full .spinner{width:28px;height:28px;border-width:3px;border-color:var(--border2);border-top-color:var(--accent)}
.loading-label{font-size:13px;color:var(--text3);margin-top:4px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:10px}
.empty-icon{font-size:40px;opacity:0.3}.empty-text{font-size:14px}
.profit-positive{color:var(--green);font-family:var(--font-mono);font-size:12px}
.profit-negative{color:var(--red);font-family:var(--font-mono);font-size:12px}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--text3);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);border:1px solid rgba(245,166,35,0.25);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:12px}
.tag-remove{cursor:pointer;line-height:1;opacity:0.7}.tag-remove:hover{opacity:1}
.section-divider{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.9px;margin:18px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.alert-info{background:var(--blue-dim);border:1px solid rgba(96,165,250,0.22);border-radius:var(--radius);padding:11px 14px;font-size:12px;color:var(--blue);margin-bottom:12px;line-height:1.6}
.alert-warning{background:var(--accent-dim);border:1px solid rgba(245,166,35,0.22);border-radius:var(--radius);padding:11px 14px;font-size:12px;color:var(--accent);margin-bottom:12px;line-height:1.6}
.alert-success{background:var(--green-dim);border:1px solid rgba(52,211,153,0.22);border-radius:var(--radius);padding:11px 14px;font-size:12px;color:var(--green);margin-bottom:12px;line-height:1.6}

.chart-svg{width:100%;overflow:visible}
.bundle-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;position:relative}
.bundle-row-header{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}

.bundle-free-gift-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer}
.bundle-free-gift-row input[type=radio]{accent-color:var(--accent)}
.bundle-gift-cost{display:flex;align-items:center;gap:8px;margin-left:8px}
.bundle-info-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;margin-top:8px}
.bundle-info-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.bundle-info-row:last-child{border-bottom:none;margin-top:4px;padding-top:8px}
.bundle-info-label{color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;font-size:11px}
.bundle-info-value{font-family:var(--font-mono);font-weight:600;color:var(--text)}
.bundle-info-gift{color:var(--green);font-size:11px;display:flex;align-items:center;gap:4px;margin-top:6px}
.signup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}
.signup-card{background:var(--surface-glass-solid);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:40px;width:100%;max-width:460px;box-shadow:var(--shadow-lg),var(--inset-hairline)}
.copy-link-box{display:flex;gap:8px;align-items:center;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-mono);font-size:11px;color:var(--text2);word-break:break-all;margin-bottom:8px}
.copy-link-btn{flex-shrink:0;background:var(--accent-dim);border:1px solid rgba(245,166,35,0.3);color:var(--accent);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.copy-link-btn:hover{background:rgba(245,166,35,0.25)}
.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.save-overlay-box{background:var(--surface-glass-solid);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:28px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow-lg),var(--inset-hairline)}
.save-overlay-box .spinner{width:36px;height:36px;border-width:3px;border-color:var(--border2);border-top-color:var(--accent)}
.save-overlay-label{font-size:14px;color:var(--text2);font-weight:600}
.email-row{display:flex;gap:8px;align-items:center}
.email-row .form-input{flex:1}
.form-url-wrap{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.product-link-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.product-link-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.product-link-meta{font-size:11px;color:var(--text3);margin-bottom:8px}
.cc-info-box{background:linear-gradient(135deg,rgba(52,152,219,0.08),rgba(52,152,219,0.03));border:1px solid rgba(52,152,219,0.2);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:20px}
.cc-info-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cc-info-text{font-size:12px;color:var(--text2);line-height:1.6}
.copy-btn-row{display:flex;gap:3px;margin-top:4px}
.copy-detail-btn{background:none;border:1px solid var(--border2);border-radius:5px;color:var(--text3);font-size:10px;padding:2px 6px;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.copy-detail-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:rgba(245,166,35,0.3)}
.copy-detail-btn.copied{background:var(--green-dim);color:var(--green);border-color:rgba(46,204,113,0.3)}
.gmail-connect-card{background:linear-gradient(135deg,rgba(46,204,113,0.06),rgba(46,204,113,0.02));border:1px solid rgba(46,204,113,0.2);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px}
.gmail-connect-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.gmail-status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.gmail-status-on{background:var(--green-dim);color:var(--green);border:1px solid rgba(46,204,113,0.25)}
.gmail-status-off{background:var(--red-dim);color:var(--red);border:1px solid rgba(231,76,60,0.25)}
.ty-url-row{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.ty-url-row .form-input{flex:1;font-size:12px}
.reschedule-card{background:linear-gradient(135deg,rgba(52,152,219,0.08),rgba(52,152,219,0.02));border:1px solid rgba(52,152,219,0.2);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:16px}
.reschedule-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.reschedule-grid{display:flex;flex-wrap:wrap;gap:8px}
.reschedule-pill{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:7px 12px;font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:96px}
.reschedule-pill .rp-date{font-weight:700;color:var(--text);font-family:var(--font-mono);font-size:12px}
.reschedule-pill .rp-count{font-size:11px;color:var(--blue);font-weight:600}
.session-warn-banner{position:fixed;top:0;left:0;right:0;z-index:8000;background:var(--red);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(231,76,60,0.5)}
.session-warn-banner button{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:6px;padding:4px 14px;font-size:12px;font-weight:700;cursor:pointer}
.session-warn-banner button:hover{background:rgba(255,255,255,0.35)}
.profit-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;margin-bottom:2px;border-radius:8px;background:var(--bg3);border:1px solid var(--border)}
.profit-row.highlight{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.25);margin-top:10px}
.profit-filter-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.profit-filter-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer;transition:all var(--transition);user-select:none}
.profit-filter-chip.active{background:var(--red-dim);border-color:rgba(231,76,60,0.3);color:var(--red)}
.profit-filter-chip input{accent-color:var(--red)}
.profit-preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.profit-result-card{background:linear-gradient(135deg,rgba(245,166,35,0.08),var(--bg2));border:1.5px solid rgba(245,166,35,0.3);border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:16px}
.profit-result-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin-bottom:8px}
.profit-result-value{font-family:var(--font-head);font-size:32px;font-weight:800}
.profit-result-sub{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.6}
/* ── PHONE INPUT ─────────────────────────────── */
.phone-input-wrap{display:flex;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;background:var(--bg3);transition:border-color var(--transition)}
.phone-input-wrap:focus-within{border-color:var(--accent)}
.phone-code-select{background:var(--bg3);border:none;border-right:1px solid var(--border2);color:var(--text);font-size:12px;padding:9px 6px;cursor:pointer;outline:none;min-width:86px;font-family:var(--font-body)}
.phone-number-input{flex:1;background:transparent;border:none;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;min-width:0}
.cof-phone-wrap{display:flex;border:1.5px solid rgba(56,67,90,0.8);border-radius:10px;overflow:hidden;background:rgba(26,30,40,0.9);transition:all 0.2s}
.cof-phone-wrap:focus-within{border-color:#f5a623;background:rgba(26,30,40,1);box-shadow:0 0 0 3px rgba(245,166,35,0.08)}
.cof-phone-code-sel{background:transparent;border:none;border-right:1px solid rgba(56,67,90,0.8);color:#e8eaf0;font-size:13px;font-family:'Outfit',sans-serif;padding:13px 8px;cursor:pointer;outline:none;min-width:88px}
.cof-phone-num-input{flex:1;background:transparent;border:none;padding:13px 16px;color:#e8eaf0;font-size:14px;font-family:'Outfit',sans-serif;outline:none;min-width:0}
.cof-phone-num-input::placeholder{color:#3a4050}
/* ── ENHANCED CHARTS ─────────────────────────── */
.chart-period-row{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.chart-period-btn{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all var(--transition)}
.chart-period-btn.active{background:linear-gradient(155deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 10px -2px rgba(245,166,35,0.4)}
.chart-card{background:linear-gradient(165deg,var(--bg3) 0%,var(--bg2) 60%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm),var(--inset-hairline)}
.chart-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.chart-title{font-family:var(--font-head);font-size:14px;font-weight:700;letter-spacing:-0.1px}
.chart-subtitle{font-size:11px;color:var(--text3)}
/* ── NOTIFICATIONS ───────────────────────────── */
.notif-bar{display:flex;align-items:center;gap:10px;background:var(--blue-dim);border:1px solid rgba(52,152,219,0.25);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--blue);margin-bottom:16px;flex-wrap:wrap}
.notif-bar button{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.toast.new-order{border-color:rgba(46,204,113,0.5);color:var(--green);font-weight:600;animation:slideIn 0.25s ease,pulse 0.6s ease 0.25s}
@keyframes pulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 24px rgba(46,204,113,0.4)}}
/* ── STAFF PAYOUTS TAB ───────────────────────── */
.payout-summary-bar{display:flex;gap:20px;flex-wrap:wrap;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:12px}
.payout-summary-item span:first-child{color:var(--text3);margin-right:4px}
.payout-summary-item span:last-child{font-family:var(--font-mono);font-weight:700}
/* COF */
.cof-root{min-height:100vh;background:linear-gradient(135deg,#0d0f14 0%,#111520 40%,#0a0c10 100%);font-family:'Outfit',sans-serif;color:#e8eaf0;position:relative;overflow-x:hidden}
.cof-root::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(245,166,35,0.08) 0%,transparent 60%);pointer-events:none;z-index:0}
.cof-root::after{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#f5a623,#e8912a,transparent);z-index:10}
.cof-wrap{max-width:620px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1}
.cof-brand{text-align:center;margin-bottom:36px}
.cof-brand-logo{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:#f5a623;letter-spacing:-1px;margin-bottom:4px;text-shadow:0 0 40px rgba(245,166,35,0.3)}
.cof-brand-tagline{font-size:13px;color:#5a6070;letter-spacing:2px;text-transform:uppercase;font-weight:500}
.cof-product-hero{background:linear-gradient(135deg,rgba(245,166,35,0.06),rgba(245,166,35,0.02));border:1px solid rgba(245,166,35,0.2);border-radius:20px;padding:24px 28px;margin-bottom:28px;position:relative;overflow:hidden}
.cof-product-name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#f5a623;margin-bottom:6px;line-height:1.2}
.cof-product-desc{font-size:14px;color:#9aa0b4;line-height:1.6}
.cof-section{background:rgba(18,21,28,0.8);border:1px solid rgba(42,48,64,0.8);border-radius:16px;padding:24px;margin-bottom:20px;backdrop-filter:blur(10px)}
.cof-section-title{font-size:11px;font-weight:700;color:#5a6070;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.cof-section-title::after{content:'';flex:1;height:1px;background:rgba(42,48,64,0.8)}
.cof-field{margin-bottom:18px}
.cof-label{font-size:12px;font-weight:600;color:#9aa0b4;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;display:block}
.cof-input,.cof-select,.cof-textarea{width:100%;background:rgba(26,30,40,0.9);border:1.5px solid rgba(56,67,90,0.8);border-radius:10px;padding:13px 16px;color:#e8eaf0;font-size:14px;font-family:'Outfit',sans-serif;outline:none;transition:all 0.2s;-webkit-appearance:none}
.cof-input:focus,.cof-select:focus,.cof-textarea:focus{border-color:#f5a623;background:rgba(26,30,40,1);box-shadow:0 0 0 3px rgba(245,166,35,0.08)}
.cof-input::placeholder,.cof-textarea::placeholder{color:#3a4050}
.cof-select option{background:#1a1e28;color:#e8eaf0}
.cof-textarea{resize:vertical;min-height:80px;line-height:1.5}
.cof-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cof-bundle-grid{display:grid;gap:12px;margin-top:4px}
.cof-bundle-card{background:rgba(26,30,40,0.9);border:2px solid rgba(56,67,90,0.6);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.cof-bundle-card:hover{border-color:rgba(245,166,35,0.4);background:rgba(245,166,35,0.04)}
.cof-bundle-card.selected{border-color:#f5a623;background:rgba(245,166,35,0.08)}
.cof-bundle-card.selected::before{content:'✓';position:absolute;top:12px;right:14px;width:22px;height:22px;background:#f5a623;color:#000;border-radius:50%;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cof-bundle-name{font-size:15px;font-weight:700;color:#e8eaf0;margin-bottom:4px}
.cof-bundle-price{font-size:22px;font-weight:700;color:#f5a623}
.cof-bundle-qty{font-size:12px;color:#5a6070;margin-top:3px}
.cof-bundle-gift{display:inline-flex;align-items:center;gap:5px;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.2);color:#2ecc71;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;margin-top:8px}
.cof-submit{width:100%;padding:18px;background:linear-gradient(135deg,#f5a623,#e8912a);border:none;border-radius:14px;color:#000;font-size:16px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;margin-top:8px}
.cof-submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 32px rgba(245,166,35,0.35)}
.cof-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.cof-success{text-align:center;padding:60px 20px}
.cof-success-icon{font-size:72px;margin-bottom:20px;animation:successPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes successPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.cof-success-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#f5a623;margin-bottom:10px}
.cof-success-sub{font-size:15px;color:#9aa0b4;line-height:1.6;max-width:360px;margin:0 auto 24px}
.cof-success-detail{background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.2);border-radius:12px;padding:16px 20px;text-align:left;max-width:380px;margin:0 auto}
.cof-success-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(46,204,113,0.1)}
.cof-success-row:last-child{border-bottom:none}
.cof-success-key{color:#5a6070}
.cof-success-val{color:#e8eaf0;font-weight:600}
.cof-error-banner{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:10px;padding:12px 16px;color:#e74c3c;font-size:13px;margin-bottom:16px}
.cof-no-product{text-align:center;padding:80px 20px}
.cof-no-product-icon{font-size:64px;margin-bottom:16px;opacity:0.3}
.cof-no-product-title{font-family:'Playfair Display',serif;font-size:24px;color:#f5a623;margin-bottom:8px}
.cof-no-product-sub{font-size:14px;color:#5a6070}
.cof-loading{text-align:center;padding:80px 20px}
.cof-spinner{width:40px;height:40px;border:3px solid rgba(56,67,90,0.5);border-top-color:#f5a623;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px}
.cof-secure-note{text-align:center;margin-top:20px;font-size:11px;color:#3a4050;display:flex;align-items:center;justify-content:center;gap:6px}
.cof-phone2-btn{background:none;border:none;color:#f5a623;font-size:12px;cursor:pointer;padding:4px 0;font-family:'Outfit',sans-serif;margin-top:4px;display:flex;align-items:center;gap:4px;opacity:0.8}
.cof-phone2-btn:hover{opacity:1}
.cof-size-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:4px}
.cof-size-btn{padding:10px 8px;background:rgba(26,30,40,0.9);border:2px solid rgba(56,67,90,0.6);border-radius:10px;color:#9aa0b4;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:center;font-family:'Outfit',sans-serif}
.cof-size-btn:hover{border-color:rgba(245,166,35,0.4)}
.cof-size-btn.selected{border-color:#f5a623;color:#f5a623;background:rgba(245,166,35,0.08)}
.cof-redirecting{text-align:center;padding:20px;margin-top:20px;font-size:13px;color:#5a6070}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .hamburger{display:block}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .stat-card.featured{grid-column:span 2}
  .content{padding:16px}
  .filters-bar{flex-direction:column;align-items:stretch}
  .search-input{width:100%}
  .bundle-row-header{flex-direction:column}
  .cof-row{grid-template-columns:1fr}
  .cof-wrap{padding:28px 16px 60px}
  .cof-product-name{font-size:22px}
}
</style>

// ─── CACHE ────────────────────────────────────────────────────
const _cache={};const _inflight={};const CACHE_TTL=90000;
function cacheGet(k){const c=_cache[k];return(c&&Date.now()-c.ts<CACHE_TTL)?c:null;}
function cacheSet(k,v){_cache[k]={v,ts:Date.now()};}
function cacheBust(keys){
  if(keys){keys.forEach(k=>{Object.keys(_cache).forEach(ck=>{if(ck.includes(k))delete _cache[ck];});});}
  else{Object.keys(_cache).forEach(k=>delete _cache[k]);}
}
const BUST_MAP={
  addOrder:['getOrders','getDashboard','getMyDashboard'],
  updateOrder:['getOrders','getDashboard','getMyDashboard'],
  deleteOrder:['getOrders','getDashboard','getMyDashboard'],

const API={
  get url(){return localStorage.getItem('apiUrl')||SITE_API_URL||'';}
  ,setUrl(u){if(u){localStorage.setItem('apiUrl',u);}else{localStorage.removeItem('apiUrl');}}
  ,async call(params){
    const url=this.url;if(!url)return{success:false,error:'API not configured.'};
    const key=JSON.stringify(params);const action=params.action||'';const isRead=action.startsWith('get');
    if(isRead){const c=cacheGet(key);if(c)return{success:true,data:c.v,_cached:true};}
    if(isRead&&_inflight[key])return _inflight[key];
    const promise=this._fetch(params,key,isRead,url);
    if(isRead)_inflight[key]=promise;
    try{const r=await promise;return r;}finally{if(isRead)delete _inflight[key];}
  }
  ,async _fetch(params,key,isRead,url){
    try{
      const r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(params)});
      if(!r.ok)return{success:false,error:`HTTP ${r.status}`};
      const text=await r.text();let data;
      try{data=JSON.parse(text);}catch{return{success:false,error:'Bad response: '+text.slice(0,80)};}
      if(isRead&&data.success)cacheSet(key,data.data||[]);
      if(!isRead&&data.success){const busted=BUST_MAP[params.action];cacheBust(busted);}
      return data;
    }catch(e){return{success:false,error:e.message};}
  }
  ,prefetch(action){const url=this.url;if(!url)return;const params={action};const key=JSON.stringify(params);const c=cacheGet(key);if(c)return;this.call(params);}
  ,async directFetch(params){
    const url=this.url;if(!url)return{success:false};
    try{
      const r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(params)});
      if(!r.ok)return{success:false};
      const text=await r.text();
      return JSON.parse(text);
    }catch(e){return{success:false};}
  }
};

function formatPhone(val){
  const v=String(val||'').trim();
  if(!v)return'—';
  const already=COUNTRIES.some(c=>v.startsWith(c.dial));
  if(already)return v;
  // Shittu Stores is Ghana-based — a number typed without a country code
  // is always Ghanaian, regardless of the device's own timezone.

function detectDefaultDialCode(){
  try{
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    if(tz.includes('Lagos'))return '+234';
    if(tz.includes('Accra')||tz.includes('Abidjan')||tz.includes('Bamako')||tz.includes('Dakar'))return '+233';
    if(tz.includes('Abidjan'))return '+225';
    if(tz.includes('Lome'))return '+228';
    if(tz.includes('Cotonou'))return '+229';
    if(tz.includes('Freetown'))return '+232';
    if(tz.includes('Monrovia'))return '+231';
    if(tz.includes('Conakry'))return '+224';
    if(tz.includes('Douala'))return '+237';
    if(tz.includes('Johannesburg'))return '+27';
    if(tz.includes('Nairobi'))return '+254';
    if(tz.includes('London'))return '+44';
    if(tz.includes('New_York')||tz.includes('Chicago')||tz.includes('Los_Angeles'))return '+1';
    if(tz.includes('Toronto')||tz.includes('Vancouver'))return '+1';
    if(tz.includes('Paris'))return '+33';
    if(tz.includes('Berlin'))return '+49';
    if(tz.includes('Kolkata')||tz.includes('Mumbai'))return '+91';
    if(tz.includes('Shanghai')||tz.includes('Beijing'))return '+86';
  }catch(e){}
  return '+233';
}

// ─── SOUND NOTIFICATION ───────────────────────────────────────
function playNotificationSound(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    [[880,0,0.3],[1100,0.18,0.25],[880,0.36,0.35]].forEach(([freq,startT,dur])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.value=freq;o.type='sine';
      g.gain.setValueAtTime(0,ac.currentTime+startT);
      g.gain.linearRampToValueAtTime(0.22,ac.currentTime+startT+0.06);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+startT+dur);
      o.start(ac.currentTime+startT);
      o.stop(ac.currentTime+startT+dur+0.05);
    });
  }catch(e){}
}

// ─── PHONE INPUT COMPONENT ─────────────────────────────────────
function PhoneInput({value,onChange,placeholder,isCof,disabled}){
  const defaultDial=useMemo(()=>detectDefaultDialCode(),[]);
  const[dialCode,setDialCode]=useState(()=>{
    const v=String(value||'');
    if(v){const c=COUNTRIES.find(c=>v.startsWith(c.dial));if(c)return c.dial;}
    return defaultDial;
  });
  const[localNum,setLocalNum]=useState(()=>{
    const v=String(value||'');
    if(!v)return'';
    const c=COUNTRIES.find(c=>v.startsWith(c.dial));
    return c?v.slice(c.dial.length):v;
  });
  const prevValue=useRef(value);

  useEffect(()=>{
    if(value!==prevValue.current){
      prevValue.current=value;
      if(!value){setLocalNum('');return;}
      const c=COUNTRIES.find(c=>value.startsWith(c.dial));
      if(c){setDialCode(c.dial);setLocalNum(value.slice(c.dial.length));}
      else setLocalNum(value);
    }
  },[value]);
  
  const emit=useCallback((dial,num)=>{
    const full=num?`${dial}${num.replace(/^0+/,'')}`:'';
    prevValue.current=full;
    onChange(full);
  },[onChange]);

  const onDialChange=e=>{setDialCode(e.target.value);emit(e.target.value,localNum);};
  const onNumChange=e=>{setLocalNum(e.target.value);emit(dialCode,e.target.value);};

  if(isCof){
    return React.createElement('div',{className:'cof-phone-wrap'},
      React.createElement('select',{className:'cof-phone-code-sel',value:dialCode,onChange:onDialChange,disabled},
        COUNTRIES.map(c=>React.createElement('option',{key:c.code+c.dial,value:c.dial},`${c.flag} ${c.dial}`))),
      React.createElement('input',{className:'cof-phone-num-input',type:'tel',placeholder:placeholder||'Phone number',value:localNum,onChange:onNumChange,disabled})
    );
  }
  return React.createElement('div',{className:'phone-input-wrap'},
    React.createElement('select',{className:'phone-code-select',value:dialCode,onChange:onDialChange,disabled},
      COUNTRIES.map(c=>React.createElement('option',{key:c.code+c.dial,value:c.dial},`${c.flag} ${c.dial}`))),
    React.createElement('input',{className:'phone-number-input',type:'tel',placeholder:placeholder||'Phone number',value:localNum,onChange:onNumChange,disabled})
  );
}

// ─── SESSION TIMEOUT ──────────────────────────────────────────
const SESSION_TIMEOUT_MS=30*60*1000;const SESSION_WARN_MS=5*60*1000;const SESSION_CHECK_MS=20*1000;
function useSessionTimeout(isLoggedIn,onLogout){
  const lastActivityRef=useRef(Date.now());
  const[showWarning,setShowWarning]=useState(false);
  const[secondsLeft,setSecondsLeft]=useState(0);
  const checkTimerRef=useRef(null);
  const resetActivity=useCallback(()=>{lastActivityRef.current=Date.now();setShowWarning(false);},[]);
  useEffect(()=>{
    if(!isLoggedIn){setShowWarning(false);return;}
    const events=['mousemove','keydown','click','scroll','touchstart'];
    events.forEach(ev=>window.addEventListener(ev,resetActivity,{passive:true}));
    resetActivity();
    checkTimerRef.current=setInterval(()=>{
      const idle=Date.now()-lastActivityRef.current;const remaining=Math.max(0,SESSION_TIMEOUT_MS-idle);
      if(remaining<=0){onLogout();return;}
      if(remaining<=SESSION_WARN_MS){setShowWarning(true);setSecondsLeft(Math.round(remaining/1000));}
    },SESSION_CHECK_MS);
    return()=>{events.forEach(ev=>window.removeEventListener(ev,resetActivity));if(checkTimerRef.current)clearInterval(checkTimerRef.current);};
  },[isLoggedIn,onLogout,resetActivity]);
  return{showWarning,secondsLeft,stayIn:resetActivity};
}

// ─── DASHBOARD NORMALIZER (v3.6 corrected) ───────────────────
// grossProfitNGN = revenueNGN (total withdrawn — actual cash received)
// netProfitAfterAllExpensesNGN = revenueNGN - totalExpensesNGN - totalPaidOutToStaff
function normalizeDash(raw){
  if(!raw)return{};
  const d={...raw};
  // GHC fields
  if(d.netRevenueGHC==null&&d.revenueGHC!=null)d.netRevenueGHC=d.revenueGHC;
  if(d.grossRevenueGHC==null)d.grossRevenueGHC=d.netRevenueGHC||d.revenueGHC||0;
  if(d.totalCOGS_GHC==null)d.totalCOGS_GHC=0;
  if(d.totalDeliveryCost_GHC==null)d.totalDeliveryCost_GHC=0;
  if(d.totalCOGS_GHC>0||d.totalDeliveryCost_GHC>0)
    d.netRevenueGHC=sp(d.grossRevenueGHC)-sp(d.totalCOGS_GHC)-sp(d.totalDeliveryCost_GHC);
  // NGN expense fields
  if(d.adSpendNGN==null&&d.totalAdSpend!=null)d.adSpendNGN=d.totalAdSpend;
  if(d.adSpendNGN==null)d.adSpendNGN=0;
  if(d.totalExpensesNGN==null)d.totalExpensesNGN=d.adSpendNGN;
  if(!d.expenseByCategory)d.expenseByCategory={};
  // ── v3.7 fix: never silently drop real staff payouts to zero ──
  // Trust the backend total, but cross-check it against the per-staff
  // breakdown (staffPayouts[].paid) the backend already sends. If the
  // breakdown adds up to more (stale cache, case-mismatch on an older
  // backend, etc.) use the larger, more complete number so Dashboard
  // and Financials always show the same real amount.
  const staffPayoutsList=Array.isArray(d.staffPayouts)?d.staffPayouts:[];
  const paidFromBreakdown=staffPayoutsList.reduce((s,st)=>s+sp(st.paid),0);
  const paidFromBackend=sp(d.totalPaidOutToStaff);
  d.totalPaidOutToStaff=Math.max(paidFromBackend,paidFromBreakdown);
  if(!d.expenseByCategory['Staff Payouts']&&d.totalPaidOutToStaff>0)
    d.expenseByCategory['Staff Payouts']=d.totalPaidOutToStaff;
  // CORRECTED: grossProfitNGN = revenueNGN (total cash withdrawn)
  const revenueNGN=sp(d.revenueNGN)||0;
  d.grossProfitNGN=revenueNGN>0?revenueNGN:(d.lastExRate!=null?sp(d.netRevenueGHC)*sp(d.lastExRate):null);
  // netProfitAfterAllExpensesNGN = withdrawn - all expenses - staff payouts paid out
  const totalReal=sp(d.totalExpensesNGN)+sp(d.totalPaidOutToStaff);
  d.netProfitAfterAllExpensesNGN=d.grossProfitNGN!=null?sp(d.grossProfitNGN)-totalReal:null;
  if(d.netProfitAfterAdsNGN==null)
    d.netProfitAfterAdsNGN=d.grossProfitNGN!=null?sp(d.grossProfitNGN)-sp(d.adSpendNGN):null;
  return d;
}

function truthy(v){return v===true||v==='true'||v==='TRUE'||v===1||v==='1';}

// Short, human-scannable order number derived from the order's UUID.
// Same order → same number every time, so no backend changes needed.
function orderNumberOf(order){
  const raw=String(order?.id||'').replace(/-/g,'');
  return 'ORD-'+(raw.slice(-8).toUpperCase()||'00000000');
}

// Finds the supplier tied to an order — via order.supplierUsername first,
// falling back to the product's assigned supplier(s).
function findSupplierForOrder(order,products,suppliers){
  let username=order?.supplierUsername||order?.supplier||'';
  if(!username){
    const product=(products||[]).find(p=>p.name===order?.product);
    if(product){
      const su=readList(product.supplierUsernames||product.supplierUsername);
      username=su[0]||product.supplierUsername||'';
    }
  }
  if(!username)return null;
  return (suppliers||[]).find(s=>s.username===username)||null;
}

// Same fallback as the backend's resolveOrderCost(): if an order was saved
// without a cost price, look it up from the product's bundle so the
// supplier payout is never blank, even on old orders.
function resolveOrderCostFrontend(order,products){
  const fromOrder=sp(order?.costOfProduct);
  if(fromOrder>0)return fromOrder;
  const product=(products||[]).find(p=>p.name===order?.product);
  if(!product)return 0;
  let bundles=[];try{bundles=JSON.parse(product.bundles||'[]');}catch(e){}
  const b=bundles.find(x=>x.label===order?.bundleLabel);
  if(!b)return 0;
  return sp(b.costPrice||b.cost||0);
}

// ─── DATA HOOK ────────────────────────────────────────────────
function useData(action,enabled=true){
  const[data,setData]=useState(()=>{if(!enabled||!API.url)return null;const c=cacheGet(JSON.stringify({action}));return c?c.v:null;});
  const[loading,setLoading]=useState(()=>{if(!enabled||!API.url)return false;return!cacheGet(JSON.stringify({action}));});
  const[error,setError]=useState('');
  const load=useCallback(async(force=false)=>{
    if(!enabled){setLoading(false);return;}if(!API.url){setLoading(false);return;}
    const c=cacheGet(JSON.stringify({action}));if(c&&!force){setData(c.v);setLoading(false);return;}
    setLoading(true);setError('');const r=await API.call({action});setLoading(false);
    if(r.success)setData(r.data||[]);else setError(r.error||'Failed');
  },[action,enabled]);
  useEffect(()=>{load();},[load]);
  return{data,loading,error,reload:()=>load(true),setData};
}

// ─── CHART PERIOD DATA BUILDER ────────────────────────────────
function buildChartData(orders,period){
  const now=new Date();
  if(period==='today'||period==='week'){
    const days=[];
    const count=period==='today'?7:7;
    for(let i=count-1;i>=0;i--){
      const d=new Date(now);d.setDate(d.getDate()-i);
      const ds=d.toISOString().split('T')[0];
      const lbl=i===0?'Today':d.toLocaleDateString('en',{weekday:'short'});
      const dayOrders=orders.filter(o=>o.date===ds);
      days.push({label:lbl,key:ds,value:dayOrders.length,delivered:dayOrders.filter(o=>statusOf(o)==='Delivered').length});
    }
    return days;
  }
  if(period==='month'){
    const days=[];
    for(let i=29;i>=0;i--){
      const d=new Date(now);d.setDate(d.getDate()-i);
      const ds=d.toISOString().split('T')[0];
      const lbl=(i%7===0||i===0)?d.toLocaleDateString('en',{month:'short',day:'numeric'}):'';
      const dayOrders=orders.filter(o=>o.date===ds);
      days.push({label:lbl,key:ds,value:dayOrders.length,delivered:dayOrders.filter(o=>statusOf(o)==='Delivered').length});
    }
    return days;
  }
  if(period==='year'){
    const months=[];
    for(let i=11;i>=0;i--){const dt=new Date(now);dt.setMonth(dt.getMonth()-i);const key=dt.toISOString().slice(0,7);months.push({key,label:dt.toLocaleString('default',{month:'short'}),value:0,delivered:0});}
    orders.forEach(o=>{const mk=String(o.date||'').slice(0,7);const m=months.find(x=>x.key===mk);if(m){m.value++;if(statusOf(o)==='Delivered')m.delivered++;}});
    return months;
  }
  // default: 6m
  const months=[];
  for(let i=5;i>=0;i--){const dt=new Date(now);dt.setMonth(dt.getMonth()-i);const key=dt.toISOString().slice(0,7);months.push({key,label:dt.toLocaleString('default',{month:'short'}),value:0,delivered:0});}
  orders.forEach(o=>{const mk=String(o.date||'').slice(0,7);const m=months.find(x=>x.key===mk);if(m){m.value++;if(statusOf(o)==='Delivered')m.delivered++;}});
  return months;
}

// ─── MAIN APP ──────────────────────────────────────────────────
function App(){
  const[sidebarOpen,setSidebarOpen]=useState(false);
  const[page,setPage]=useState('dashboard');
  const[user,setUser]=useState(()=>{try{const u=localStorage.getItem('ssUser');return u?JSON.parse(u):null;}catch{return null;}});
  const[notifPermission,setNotifPermission]=useState(()=>{if(typeof Notification==='undefined')return'denied';return Notification.permission;});
  const urlParams=useMemo(()=>new URLSearchParams(window.location.search),[]);
  const signupType=urlParams.get('signup');const signupToken=urlParams.get('token');const viewMode=urlParams.get('view');const productParam=urlParams.get('product');
  const login=useCallback(u=>{setUser(u);localStorage.setItem('ssUser',JSON.stringify(u));sendLoginAlert(u);},[]);
  const logout=useCallback(()=>{setUser(null);localStorage.removeItem('ssUser');setPage('dashboard');},[]);
  const nav=useCallback(p=>{setPage(p);setSidebarOpen(false);},[]);

  // ── Notification permission request ──
  const requestNotif=useCallback(async()=>{
    if(typeof Notification==='undefined')return;
    const p=await Notification.requestPermission();
    setNotifPermission(p);
    if(p==='granted')toast('🔔 Notifications enabled! You will be alerted when new orders arrive.','success');
  },[]);

  // ── Order polling for push notifications ──
  const pollIntervalRef=useRef(null);
  const lastOrderCountRef=useRef(-1);
  const notifPermRef=useRef(notifPermission);
  useEffect(()=>{notifPermRef.current=notifPermission;},[notifPermission]);

  useEffect(()=>{
    if(!user||signupType||viewMode){
      if(pollIntervalRef.current)clearInterval(pollIntervalRef.current);
      return;
    }
    // Init notification permission on login
    if(typeof Notification!=='undefined'&&Notification.permission==='default'){
      // Will prompt on user's first click via topbar button
    }

    const poll=async()=>{
      if(!API.url)return;
      try{
        const r=await API.directFetch({action:'getOrders'});
        if(!r.success||!Array.isArray(r.data))return;
        const count=r.data.length;
        if(lastOrderCountRef.current<0){lastOrderCountRef.current=count;return;}
        if(count>lastOrderCountRef.current){
          const diff=count-lastOrderCountRef.current;
          lastOrderCountRef.current=count;
          // Bust cache so UI refreshes
          cacheBust(['getOrders','getDashboard','getMyDashboard']);
          // Play sound
          playNotificationSound();
          // Toast notification
          toast(`🛒 ${diff} new order${diff>1?'s':''} received!`,'success');
          // Browser notification
          if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
            try{new Notification(`🛍️ New Order${diff>1?'s':''}!`,{body:`${diff} new order${diff>1?'s':''} on Shittu Stores`,tag:'shittu-new-order',requireInteraction:false});}catch(e){}
          }
        }else{
          lastOrderCountRef.current=count;
        }
      }catch(e){}
    };

    // First poll after 8 seconds, then every 60 seconds
    const firstPoll=setTimeout(poll,8000);
    pollIntervalRef.current=setInterval(poll,60000);
    return()=>{clearTimeout(firstPoll);if(pollIntervalRef.current)clearInterval(pollIntervalRef.current);};
  },[user,signupType,viewMode]);

  // ── Session timeout ──
  const sessionActive=!!user&&!signupType&&!viewMode;
  const{showWarning,secondsLeft,stayIn}=useSessionTimeout(sessionActive,logout);

  if(viewMode==='order')return React.createElement(ThemeProvider,null,React.createElement(CustomerOrderForm,{productName:productParam||''}),React.createElement(ToastContainer));
  if(signupType&&signupToken)return React.createElement(ThemeProvider,null,React.createElement(SignupPage,{type:signupType,token:signupToken}),React.createElement(ToastContainer));
  if(!user)return React.createElement(ThemeProvider,null,React.createElement(LoginPage,{onLogin:login}),React.createElement(ToastContainer));

  const isAdmin=user.role==='admin';const isSupplier=user.role==='supplier';const isCC=!isAdmin&&!isSupplier;
  const perms=user.permissions==='all'?['all']:(user.permissions||'').split(',').map(s=>s.trim()).filter(Boolean);
  const can=p=>isAdmin||perms.includes('all')||perms.includes(p);

  const navItems=[
    {id:'dashboard',icon:'dashboard',label:'Dashboard',show:true},
    {id:'orders',icon:'package',label:'Orders',show:isAdmin||isSupplier||can('view_orders')},
    {id:'myanalytics',icon:'trending',label:'My Analytics',show:isCC},
    {id:'financials',icon:'wallet',label:'Financials',show:isAdmin||can('view_financials')},
    {id:'analytics',icon:'trending',label:'Analytics',show:isAdmin||isSupplier},
    {id:'expenses',icon:'trenddown',label:'Expenses',show:isAdmin||can('manage_expenses')},
    {id:'products',icon:'tag',label:'Products',show:isAdmin},
    {id:'staff',icon:'users',label:'Staff',show:isAdmin},
    {id:'suppliers',icon:'truck',label:'Suppliers',show:isAdmin},
    {id:'settings',icon:'settings',label:'Settings',show:true},
  ].filter(x=>x.show);

  const ctx={user,isAdmin,isSupplier,isCC,can,nav};

  function renderPage(){
    switch(page){
      case 'dashboard':   return React.createElement(DashboardPage,ctx);
      case 'orders':      return React.createElement(OrdersPage,ctx);
      case 'myanalytics': return React.createElement(StaffAnalyticsPage,ctx);
      case 'financials':  return React.createElement(FinancialsPage,{...ctx});
      case 'analytics':   return React.createElement(AnalyticsPage,ctx);
      case 'expenses':    return React.createElement(ExpensesPage,ctx);
      case 'products':    return React.createElement(ProductsPage,ctx);
      case 'staff':       return React.createElement(StaffPage,ctx);
      case 'suppliers':   return React.createElement(SuppliersPage,ctx);
      case 'settings':    return React.createElement(SettingsPage,{...ctx,onUserUpdate:(u)=>{setUser(u);localStorage.setItem('ssUser',JSON.stringify(u));}});
      default:            return React.createElement(DashboardPage,ctx);
    }
  }

  return React.createElement(ThemeProvider,null,
    showWarning&&React.createElement(SessionWarningModal,{secondsLeft,onStay:stayIn,onLogout:logout}),
    React.createElement(AppShell,{user,navItems,page,nav,sidebarOpen,setSidebarOpen,logout,notifPermission,onRequestNotif:requestNotif},renderPage()),
    React.createElement(ToastContainer));
}

// ─── ERROR BOUNDARY ───────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return{hasError:true,error};}
  componentDidCatch(error,info){console.error('App error:',error,info);}
  render(){
    if(this.state.hasError)return React.createElement('div',{style:{padding:40,textAlign:'center',fontFamily:'sans-serif',color:'#e8eaf0',background:'#0a0c10',minHeight:'100vh'}},
      React.createElement('div',{style:{fontSize:40,marginBottom:16}},'⚠️'),
      React.createElement('div',{style:{fontSize:18,fontWeight:700,marginBottom:8}},'Something went wrong'),
      React.createElement('div',{style:{fontSize:13,color:'#9aa0b4',marginBottom:20}},String(this.state.error?.message||this.state.error||'Unknown error')),
      React.createElement('button',{onClick:()=>window.location.reload(),style:{padding:'10px 20px',background:'#f5a623',color:'#000',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer'}},'Reload App'));
    return this.props.children;
  }
}

// ─── BOOTSTRAP ────────────────────────────────────────────────
(function bootstrap(){
  try{
    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ErrorBoundary,null,React.createElement(App)));
  }catch(e){
    document.getElementById('root').innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif;color:#e74c3c">Failed to start: '+(e&&e.message||e)+'</div>';
  }
})();
</script>
